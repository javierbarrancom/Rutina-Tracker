<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rotación de Rutina</title>
<style>
  :root{
    --bg: #1b1f24;
    --bg-panel: #22272e;
    --bg-chip: #2b323a;
    --bg-input: #1a1e23;
    --line: #384049;
    --text: #e9e6df;
    --text-dim: #9aa2ab;
    --ochre: #c9973a;
    --teal: #4f8b8f;
    --rust: #b5533c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    padding:14px 10px 40px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;margin:0;}
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:14px;}
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ochre);margin-bottom:2px;
  }
  header h1{font-size:26px;line-height:1;}
  header p{color:var(--text-dim);font-size:12px;margin-top:4px;line-height:1.3;}

  .banner{
    border-radius:6px;padding:8px 10px;font-size:11.5px;margin-bottom:12px;
    font-family:'IBM Plex Mono',monospace;line-height:1.4;
  }
  .banner.error{background:rgba(181,83,60,.15);border:1px solid rgba(181,83,60,.5);color:#e8a893;}
  .banner.ok{background:rgba(79,139,143,.12);border:1px solid rgba(79,139,143,.4);color:var(--teal);}

  .day-tabs{display:flex;gap:6px;margin:12px 0 12px;}
  .day-tab{
    flex:1;padding:8px 4px;background:var(--bg-panel);border:1px solid var(--line);
    border-radius:6px;text-align:center;cursor:pointer;transition:.15s;
  }
  .day-tab .letter{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;line-height:1;}
  .day-tab .name{font-size:9.5px;color:var(--text-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-tab.active{border-color:var(--ochre);background:rgba(201,151,58,.1);}
  .day-tab.active .letter{color:var(--ochre);}

  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;}
  .panel h2{font-size:20px;margin-bottom:1px;}
  .panel .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}

  .section-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ochre);margin:12px 0 6px;display:flex;align-items:center;gap:6px;
  }
  .section-label.first{margin-top:0;}
  .section-hint{font-size:10.5px;color:var(--text-dim);margin:-2px 0 8px;font-style:italic;}

  /* --- Principal exercise card --- */
  .ex-row{
    background:var(--bg-chip);border:1px solid var(--line);border-radius:8px;
    padding:10px 10px 8px;margin-bottom:8px;
  }
  .ex-row .ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px;}
  .ex-name{font-size:13px;font-weight:600;}
  .ex-last{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-dim);text-align:right;line-height:1.3;}
  .ex-last .comment{color:var(--ochre);display:block;}

  .row-line{display:flex;gap:6px;margin-bottom:6px;align-items:flex-end;}
  .field-wrap{flex:1;}
  .field-wrap label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px;}
  
  /* PREVENCIÓN DE ZOOM */
  input, textarea, select {
    background:var(--bg-input);border:1px solid var(--line);border-radius:5px;
    color:var(--text);font-family:'IBM Plex Mono',monospace;
    padding:6px 8px;width:100%;
    font-size:16px !important;
  }
  input::placeholder, textarea::placeholder{color:#5a626b;}
  textarea{resize:none;font-family:'Inter',sans-serif;height:36px;}

  .sets-block label.sets-label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}
  .sets-grid{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
  .set-input-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:38px;}
  .set-input-wrap span{font-size:8.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .set-input-wrap input{text-align:center;padding:5px 2px;}

  .ex-remove{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--rust);cursor:pointer;margin-top:4px;text-align:right;}

  /* --- Circuit config --- */
  .circuit-config{
    background:var(--bg-chip);border:1px solid var(--line);border-radius:8px;
    padding:10px;margin-bottom:10px;
  }
  .circuit-config-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

  .tier-block{margin-bottom:8px;}
  .tier-label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--text-dim);margin-bottom:5px;display:flex;align-items:center;gap:4px;
  }
  .tier-dot{width:5px;height:5px;border-radius:50%;display:inline-block;}
  .tier-1 .tier-dot{background:var(--teal);}
  .tier-2 .tier-dot{background:var(--ochre);}
  .tier-3 .tier-dot{background:var(--rust);}
  .tier-4 .tier-dot{background:#8b949e;}
  
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{
    background:var(--bg-input);border:1px dashed var(--line);color:var(--text-dim);
    padding:5px 9px;border-radius:12px;font-size:11.5px;cursor:pointer;transition:.12s;
  }
  .chip:hover{border-color:var(--teal);color:var(--text);}
  
  /* ESTILOS PARA EJERCICIOS CON CONFLICTO */
  .chip.warn{opacity:0.6; border-color:var(--rust); color:var(--text-dim);}
  .chip.warn:hover{opacity:1; color:var(--rust); border-color:var(--rust);}
  
  .chip .stale{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--ochre);margin-left:3px;}

  .save-row{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .save-btn{
    background:var(--ochre);color:#20160a;border:none;border-radius:6px;
    padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
    letter-spacing:.02em;cursor:pointer;width:100%;
  }
  .save-btn:active{transform:scale(.98);}
  .save-msg{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-align:center;}

  .history h3{font-size:16px;margin-bottom:8px;}
  .week-divider{display:flex;align-items:center;gap:8px;margin:12px 0 8px;}
  .week-divider:first-child{margin-top:0;}
  .week-divider .line{flex:1;height:1px;background:var(--line);}
  .week-divider .label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ochre);
    text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
  }
  .hist-entry{padding:8px 0;border-bottom:1px solid var(--line);}
  .hist-entry:last-child{border-bottom:none;}
  .hist-head{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
  .hist-day{color:var(--ochre);font-weight:600;font-size:12px;}
  .hist-date{font-family:'IBM Plex Mono',monospace;color:var(--text-dim);font-size:10.5px;}
  .hist-actions{margin-left:auto;display:flex;gap:8px;}
  .hist-action{font-family:'IBM Plex Mono',monospace;font-size:9.5px;cursor:pointer;text-decoration:underline;}
  .hist-action.edit{color:var(--teal);}
  .hist-action.del{color:var(--rust);}
  .editing-banner{
    background:rgba(201,151,58,.12);border:1px solid rgba(201,151,58,.4);color:var(--ochre);
    border-radius:6px;padding:8px 10px;font-size:11px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .editing-banner button{
    background:none;border:1px solid var(--ochre);color:var(--ochre);border-radius:4px;
    padding:4px 8px;font-size:9.5px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .hist-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px;}
  .hist-ex{font-size:11.5px;margin-bottom:3px;}
  .hist-ex .n{color:var(--text);font-weight:500;}
  .hist-ex .v{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);display:block;}
  .hist-ex .c{color:var(--ochre);font-size:10.5px;font-style:italic;display:block;}
  .hist-circuit-cfg{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--teal);margin-bottom:4px;}
  .empty{color:var(--text-dim);font-size:12px;font-style:italic;padding:8px 0;}
  .reset{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    border-radius:5px;padding:6px 10px;font-size:10.5px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .reset-confirm-box{
    margin-top:8px;padding:10px;border:1px solid var(--rust);border-radius:6px;
    background:rgba(181,83,60,.1);font-size:11.5px;
  }
  .reset-confirm-box p{margin:0 0 8px;color:var(--text);}
  .reset-confirm-box .btns{display:flex;gap:6px;}
  .reset-confirm-box button{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;border-radius:4px;
    padding:5px 10px;cursor:pointer;border:1px solid var(--line);
  }
  .btn-confirm-yes{background:var(--rust);color:#fff;border-color:var(--rust);}
  .btn-confirm-no{background:none;color:var(--text-dim);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Rotación 3 días · en casa</div>
    <h1>Tu bloque de hoy</h1>
    <p>Fijos: series, peso y reps. Accesorios: circuito por tiempo.</p>
  </header>

  <div id="storageBanner"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div style="margin-bottom:12px;">
    <button class="reset" id="settingsToggle" style="width:100%;">⚙ Editar ejercicios</button>
  </div>
  <div id="settingsPanel"></div>
  <div id="panelHost"></div>

  <div class="panel history">
    <h3>Historial</h3>
    <div id="histList"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
      <button class="reset" id="exportBtn">⬇ Exportar</button>
      <button class="reset" id="importBtn">⬆ Importar</button>
      <button class="reset" id="resetBtn">Borrar todo</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div id="resetConfirm"></div>
  </div>
</div>

<script>
// ACTUALIZADO: 4 Familias de movimiento
const ACCESSORY_TIERS = [
  { label: 'Core y Estabilidad', cls:'tier-1', items: ['Rueda abdominal', 'Halo mancuerna', 'Equilibrio BOSU', 'Lateral Swings + Rotation', 'Renegade row'] },
  { label: 'Cadena Post. y Tracción', cls:'tier-2', items: ['Dumbbell Swings', 'Deadlift', 'High Pulls', 'Remo a una mano', 'Curl + Pull over'] },
  { label: 'Empuje y Hombro', cls:'tier-3', items: ['Flexiones'] },
  { label: 'Híbridos Metabólicos', cls:'tier-4', items: ['Thrusters', 'Dumbbell Snatch alterno', 'Clean and press', 'Burpees (sin salto)', 'Squat + Rotational Press', 'Lunge + elevación frontal'] }
];

const DAYS = {
  A: {
    name: 'Press horizontal + Búlgaras',
    principals: ['Press horizontal', 'Búlgaras'],
    tiers: ACCESSORY_TIERS
  },
  B: {
    name: 'Dominadas + RDL alterno',
    principals: ['Dominadas con lastre', 'RDL alterno'],
    tiers: ACCESSORY_TIERS
  },
  C: {
    name: 'Press inclinado + Chin Ups',
    principals: ['Press inclinado', 'Chin Ups'],
    tiers: ACCESSORY_TIERS
  }
};

// DICCIONARIO DE CONFLICTOS POR DÍA
const CONFLICTS = {
  A: ['Flexiones', 'Thrusters', 'Squat + Rotational Press', 'Lunge + elevación frontal'],
  B: ['Deadlift', 'Dumbbell Swings', 'Remo a una mano', 'High Pulls', 'Curl + Pull over'],
  C: ['Curl + Pull over', 'Flexiones', 'Clean and press']
};

const DEFAULT_SETS = {
  'Press horizontal': 4,
  'Búlgaras': 3,
  'Dominadas con lastre': 4,
  'RDL alterno': 3,
  'Press inclinado': 4,
  'Chin Ups': 3
};

const STORAGE_KEY = 'javier-rutina-history-v2';
const CONFIG_STORAGE_KEY = 'javier-rutina-config-v2'; // Cambio a v2 para cargar las 4 familias nuevas limpiamente

let settingsOpen = false;
let activeDay = 'A';
let principalState = {};
let circuitConfig = { rounds:'', workSec:'', restEx:'', restRounds:'' };
let circuitExercises = {};

let history = [];
let sessionDate = new Date().toISOString().slice(0,10);
let editingEntry = null;
let confirmingDelete = null;

function showBanner(type, text){
  document.getElementById('storageBanner').innerHTML = `<div class="banner ${type}">${text}</div>`;
}
function clearBanner(){ document.getElementById('storageBanner').innerHTML = ''; }
function storageAvailable(){
  try{
    const t = '__test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}

async function loadHistory(){
  if(!storageAvailable()){
    showBanner('error', '⚠ Almacenamiento local bloqueado en este navegador.');
    history = [];
    renderHistory();
    return;
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    history = raw ? JSON.parse(raw) : [];
    clearBanner();
  }catch(e){
    history = [];
    showBanner('error', '⚠ No se pudo leer el historial guardado.');
  }
  renderHistory();
}

async function saveHistory(){
  if(!storageAvailable()){
    showBanner('error', '⚠ No se pudo guardar: almacenamiento local bloqueado.');
    return false;
  }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    clearBanner();
    return true;
  }catch(e){
    showBanner('error', '⚠ Error al guardar tus datos.');
    return false;
  }
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `rutina-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed)) throw new Error('formato inválido');
      const merge = confirm('¿Fusionar con tu historial actual? Aceptar = fusionar, Cancelar = reemplazar todo.');
      if(merge){
        const existingKeys = new Set(history.map(h => h.date + '|' + h.day));
        parsed.forEach(p => {
          if(!existingKeys.has(p.date + '|' + p.day)) history.push(p);
        });
      } else {
        history = parsed;
      }
      await saveHistory();
      renderHistory();
      resetDayState();
      renderPanel();
      showBanner('ok', '✓ Copia importada correctamente.');
    }catch(err){
      showBanner('error', '⚠ El archivo no es válido.');
    }
  };
  reader.readAsText(file);
}

function daysBetween(dateStrStart, dateStrEnd){
  const d1 = new Date(dateStrStart.slice(0,10) + 'T00:00:00');
  const d2 = new Date(dateStrEnd.slice(0,10) + 'T00:00:00');
  return Math.floor((d2.getTime() - d1.getTime()) / 86400000);
}

function loadConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if(!raw) return;
    const cfg = JSON.parse(raw);
    if(cfg.tiers){
      cfg.tiers.forEach((items, i) => {
        if(ACCESSORY_TIERS[i] && Array.isArray(items)) ACCESSORY_TIERS[i].items = items;
      });
    }
    if(cfg.principals){
      Object.keys(cfg.principals).forEach(day => {
        if(DAYS[day] && Array.isArray(cfg.principals[day])) DAYS[day].principals = cfg.principals[day];
      });
    }
  }catch(e){}
}

function saveConfig(){
  const cfg = {
    tiers: ACCESSORY_TIERS.map(t => t.items),
    principals: { A: DAYS.A.principals, B: DAYS.B.principals, C: DAYS.C.principals }
  };
  try{ localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(cfg)); }catch(e){}
}

function lastPrincipalEntry(name){
  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  for(let i = 0; i < sorted.length; i++){
    if(sorted[i].date.slice(0,10) <= sessionDate){
      const found = (sorted[i].principals || []).find(e => e.name === name);
      if(found) return { date: sorted[i].date, ...found };
    }
  }
  return null;
}

function lastCircuitExercise(name){
  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  for(let i = 0; i < sorted.length; i++){
    if(sorted[i].date.slice(0,10) <= sessionDate){
      const c = sorted[i].circuit;
      if(!c) continue;
      const found = (c.exercises || []).find(e => e.name === name);
      if(found) return { date: sorted[i].date, ...found };
    }
  }
  return null;
}

function resetDayState(){
  const day = DAYS[activeDay];
  principalState = {};
  day.principals.forEach(p => {
    const last = lastPrincipalEntry(p);
    const setsCount = last && last.reps ? last.reps.length : (DEFAULT_SETS[p] || 4);
    principalState[p] = { weight:'', setsCount: setsCount, reps: new Array(setsCount).fill(''), comment:'' };
  });
  circuitConfig = { rounds:'', workSec:'', restEx:'', restRounds:'' };
  circuitExercises = {};
}

function loadEntryForEditing(entry){
  const idx = history.indexOf(entry);
  if(idx === -1) return;
  history.splice(idx, 1);
  editingEntry = entry;

  activeDay = entry.day;
  sessionDate = entry.date.slice(0,10);

  principalState = {};
  (entry.principals || []).forEach(p => {
    principalState[p.name] = {
      weight: p.weight || '',
      setsCount: (p.reps || []).length || 0,
      reps: (p.reps || []).slice(),
      comment: p.comment || ''
    };
  });
  DAYS[activeDay].principals.forEach(p => {
    if(!principalState[p]) principalState[p] = { weight:'', setsCount:0, reps:[], comment:'' };
  });

  circuitConfig = entry.circuit
    ? { rounds: entry.circuit.rounds || '', workSec: entry.circuit.workSec || '', restEx: entry.circuit.restEx || '', restRounds: entry.circuit.restRounds || '' }
    : { rounds:'', workSec:'', restEx:'', restRounds:'' };
  circuitExercises = {};
  if(entry.circuit && entry.circuit.exercises){
    entry.circuit.exercises.forEach(e => {
      circuitExercises[e.name] = { weight: e.weight || '', comment: e.comment || '' };
    });
  }

  renderTabs();
  renderPanel();
  renderHistory();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteEntry(entry){
  const idx = history.indexOf(entry);
  if(idx === -1) return;
  history.splice(idx, 1);
  await saveHistory();
  renderHistory();
  resetDayState();
  renderPanel();
}

function renderSettingsPanel(){
  const host = document.getElementById('settingsPanel');
  host.innerHTML = '';
  if(!settingsOpen) return;

  const panel = document.createElement('div');
  panel.className = 'panel';

  const h2 = document.createElement('h2');
  h2.textContent = 'Editar ejercicios';
  panel.appendChild(h2);
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = 'No afecta a sesiones previas';
  panel.appendChild(sub);

  const pLabel = document.createElement('div');
  pLabel.className = 'section-label first';
  pLabel.textContent = 'Fijos por día';
  panel.appendChild(pLabel);

  Object.keys(DAYS).forEach(dayKey => {
    const dayBlock = document.createElement('div');
    dayBlock.style.marginBottom = '10px';
    const dTitle = document.createElement('div');
    dTitle.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;';
    dTitle.textContent = `Día ${dayKey} — ${DAYS[dayKey].name}`;
    dayBlock.appendChild(dTitle);

    DAYS[dayKey].principals.forEach((name, idx) => {
      const row = document.createElement('div');
      row.className = 'row-line';
      row.innerHTML = `<div class="field-wrap"><input type="text" data-role="principalName"></div>`;
      const inp = row.querySelector('input');
      inp.value = name;
      inp.onchange = () => {
        const newName = inp.value.trim();
        if(!newName){ inp.value = DAYS[dayKey].principals[idx]; return; }
        DAYS[dayKey].principals[idx] = newName;
        saveConfig();
        if(activeDay === dayKey){ resetDayState(); renderPanel(); }
      };
      dayBlock.appendChild(row);
    });
    panel.appendChild(dayBlock);
  });

  const aLabel = document.createElement('div');
  aLabel.className = 'section-label';
  aLabel.textContent = 'Accesorios compartidos';
  panel.appendChild(aLabel);

  ACCESSORY_TIERS.forEach(tier => {
    const block = document.createElement('div');
    block.className = 'tier-block';
    const label = document.createElement('div');
    label.className = 'tier-label ' + tier.cls;
    label.innerHTML = `<span class="tier-dot"></span>${tier.label}`;
    block.appendChild(label);

    const chips = document.createElement('div');
    chips.className = 'chips';
    tier.items.forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.style.cursor = 'default';
      const itemSpan = document.createElement('span');
      itemSpan.textContent = item;
      const removeSpan = document.createElement('span');
      removeSpan.textContent = ' ✕';
      removeSpan.style.cssText = 'color:var(--rust);cursor:pointer;margin-left:4px;';
      removeSpan.onclick = () => {
        tier.items = tier.items.filter(i => i !== item);
        saveConfig();
        renderSettingsPanel();
        renderPanel();
      };
      chip.appendChild(itemSpan);
      chip.appendChild(removeSpan);
      chips.appendChild(chip);
    });
    block.appendChild(chips);

    const addRow = document.createElement('div');
    addRow.className = 'row-line';
    addRow.style.marginTop = '6px';
    addRow.innerHTML = `<div class="field-wrap"><input type="text" placeholder="Nuevo..." data-role="newItem"></div>`;
    const newInput = addRow.querySelector('[data-role="newItem"]');
    const addBtn = document.createElement('button');
    addBtn.className = 'reset';
    addBtn.textContent = '+ Añadir';
    addBtn.style.flex = 'none';
    addBtn.style.alignSelf = 'flex-end';
    addBtn.onclick = () => {
      const val = newInput.value.trim();
      if(!val || tier.items.includes(val)) return;
      tier.items.push(val);
      newInput.value = '';
      saveConfig();
      renderSettingsPanel();
      renderPanel();
    };
    newInput.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); addBtn.click(); } };
    addRow.appendChild(addBtn);
    block.appendChild(addRow);

    panel.appendChild(block);
  });

  host.appendChild(panel);
}

function renderTabs(){
  const host = document.getElementById('dayTabs');
  host.innerHTML = '';
  Object.keys(DAYS).forEach(d => {
    const el = document.createElement('div');
    el.className = 'day-tab' + (d === activeDay ? ' active' : '');
    el.innerHTML = `<div class="letter">${d}</div><div class="name">${DAYS[d].name}</div>`;
    el.onclick = () => { activeDay = d; resetDayState(); renderPanel(); renderTabs(); };
    host.appendChild(el);
  });
}

function principalRow(name){
  const st = principalState[name];
  const last = lastPrincipalEntry(name);
  const wrap = document.createElement('div');
  wrap.className = 'ex-row';

  const lastReps = last && last.reps ? last.reps.join(',') : null;
  const daysDiff = last ? daysBetween(last.date, sessionDate) : 0;
  const lastLine = last
    ? `últ: ${lastReps || '–'} reps @ ${last.weight || '–'}kg · ${daysDiff}d`
    : 'sin datos';
  const commentLine = last && last.comment ? `<span class="comment">"${last.comment}"</span>` : '';

  wrap.innerHTML = `
    <div class="ex-top">
      <div class="ex-name">${name}</div>
      <div class="ex-last">${lastLine}${commentLine}</div>
    </div>
    <div class="row-line">
      <div class="field-wrap">
        <label>Peso (kg)</label>
        <input type="text" inputmode="decimal" placeholder="${last ? last.weight || '—' : '—'}" data-role="weight">
      </div>
      <div class="field-wrap">
        <label>Nº series</label>
        <input type="text" inputmode="numeric" data-role="setsCount" value="${st.setsCount}">
      </div>
    </div>
    <div class="sets-block">
      <label class="sets-label">Reps por serie</label>
      <div class="sets-grid" data-role="setsGrid"></div>
    </div>
    <div class="row-line" style="margin-top:2px;">
      <div class="field-wrap">
        <label>Comentario</label>
        <textarea rows="1" placeholder="ej. subir peso, molestias..." data-role="comment"></textarea>
      </div>
    </div>
  `;

  const weightInput = wrap.querySelector('[data-role="weight"]');
  weightInput.value = st.weight;
  weightInput.oninput = () => { st.weight = weightInput.value; };

  const setsCountInput = wrap.querySelector('[data-role="setsCount"]');
  setsCountInput.oninput = () => {
    let n = parseInt(setsCountInput.value) || 0;
    n = Math.max(0, Math.min(n, 10));
    st.setsCount = n;
    const cur = st.reps;
    const next = new Array(n).fill('');
    for(let i = 0; i < Math.min(n, cur.length); i++) next[i] = cur[i];
    st.reps = next;
    renderSetsGrid();
  };

  const commentInput = wrap.querySelector('[data-role="comment"]');
  commentInput.value = st.comment;
  commentInput.oninput = () => { st.comment = commentInput.value; };

  function renderSetsGrid(){
    const grid = wrap.querySelector('[data-role="setsGrid"]');
    grid.innerHTML = '';
    for(let i = 0; i < st.setsCount; i++){
      const setWrap = document.createElement('div');
      setWrap.className = 'set-input-wrap';
      const lastRepVal = last && last.reps && last.reps[i] ? last.reps[i] : '—';
      setWrap.innerHTML = `<span>S${i+1}</span><input type="text" inputmode="numeric" placeholder="${lastRepVal}">`;
      const inp = setWrap.querySelector('input');
      inp.value = st.reps[i] || '';
      inp.oninput = () => { st.reps[i] = inp.value; };
      grid.appendChild(setWrap);
    }
  }
  renderSetsGrid();

  return wrap;
}

function circuitConfigBlock(){
  const wrap = document.createElement('div');
  wrap.className = 'circuit-config';
  wrap.innerHTML = `
    <div class="section-label first" style="margin-bottom:6px;">Configuración circuito</div>
    <div class="circuit-config-grid">
      <div class="field-wrap"><label>Series</label><input type="text" inputmode="numeric" data-role="rounds" placeholder="ej. 3"></div>
      <div class="field-wrap"><label>Trabajo (s)</label><input type="text" inputmode="numeric" data-role="workSec" placeholder="ej. 45"></div>
      <div class="field-wrap"><label>Desc. Ejerc (s)</label><input type="text" inputmode="numeric" data-role="restEx" placeholder="ej. 10"></div>
      <div class="field-wrap"><label>Desc. Series (s)</label><input type="text" inputmode="numeric" data-role="restRounds" placeholder="ej. 60"></div>
    </div>
  `;
  ['rounds','workSec','restEx','restRounds'].forEach(role => {
    const inp = wrap.querySelector(`[data-role="${role}"]`);
    inp.value = circuitConfig[role];
    inp.oninput = () => { circuitConfig[role] = inp.value; };
  });
  return wrap;
}

function circuitExerciseRow(name){
  const st = circuitExercises[name];
  const last = lastCircuitExercise(name);
  const wrap = document.createElement('div');
  wrap.className = 'ex-row';
  const daysDiff = last ? daysBetween(last.date, sessionDate) : 0;
  const lastLine = last
    ? `últ: ${last.weight ? last.weight + 'kg' : 'sin peso'} · ${daysDiff}d`
    : 'sin datos';
  const commentLine = last && last.comment ? `<span class="comment">"${last.comment}"</span>` : '';
  wrap.innerHTML = `
    <div class="ex-top">
      <div class="ex-name">${name}</div>
      <div class="ex-last">${lastLine}${commentLine}</div>
    </div>
    <div class="row-line">
      <div class="field-wrap">
        <label>Peso (kg) — opcional</label>
        <input type="text" inputmode="decimal" placeholder="${last && last.weight ? last.weight : 'sin peso'}" data-role="weight">
      </div>
    </div>
    <div class="row-line">
      <div class="field-wrap">
        <label>Comentario</label>
        <textarea rows="1" placeholder="ej. fácil, molestias..." data-role="comment"></textarea>
      </div>
    </div>
  `;
  const weightInput = wrap.querySelector('[data-role="weight"]');
  weightInput.value = st.weight;
  weightInput.oninput = () => { st.weight = weightInput.value; };
  const commentInput = wrap.querySelector('[data-role="comment"]');
  commentInput.value = st.comment;
  commentInput.oninput = () => { st.comment = commentInput.value; };

  const removeBtn = document.createElement('div');
  removeBtn.className = 'ex-remove';
  removeBtn.textContent = '✕ quitar';
  removeBtn.onclick = () => { delete circuitExercises[name]; renderPanel(); };
  wrap.appendChild(removeBtn);

  return wrap;
}

function renderPanel(){
  const day = DAYS[activeDay];
  const host = document.getElementById('panelHost');
  host.innerHTML = '';

  const panel = document.createElement('div');
  panel.className = 'panel';

  if(editingEntry){
    const editBanner = document.createElement('div');
    editBanner.className = 'editing-banner';
    editBanner.innerHTML = `<span>✎ Editando sesión ${new Date(editingEntry.date).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}.</span>`;
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.onclick = () => {
      history.push(editingEntry);
      editingEntry = null;
      resetDayState();
      renderTabs();
      renderPanel();
      renderHistory();
    };
    editBanner.appendChild(cancelBtn);
    panel.appendChild(editBanner);
  }

  const h2 = document.createElement('h2');
  h2.textContent = `Día ${activeDay}`;
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = day.name;
  panel.appendChild(h2);
  panel.appendChild(sub);

  const pLabel = document.createElement('div');
  pLabel.className = 'section-label first';
  pLabel.textContent = 'Fecha';
  panel.appendChild(pLabel);
  const dateWrap = document.createElement('div');
  dateWrap.className = 'row-line';
  dateWrap.innerHTML = `<div class="field-wrap"><input type="date" data-role="sessionDate"></div>`;
  const dateInput = dateWrap.querySelector('[data-role="sessionDate"]');
  dateInput.value = sessionDate;
  dateInput.onchange = () => { 
    sessionDate = dateInput.value; 
    resetDayState();
    renderPanel();
  };
  panel.appendChild(dateWrap);

  const pLabel2 = document.createElement('div');
  pLabel2.className = 'section-label';
  pLabel2.textContent = 'Fijos';
  panel.appendChild(pLabel2);
  day.principals.forEach(p => panel.appendChild(principalRow(p)));

  const cLabel = document.createElement('div');
  cLabel.className = 'section-label';
  cLabel.textContent = 'Circuito accesorios';
  panel.appendChild(cLabel);
  panel.appendChild(circuitConfigBlock());

  const activeNames = Object.keys(circuitExercises);
  if(activeNames.length){
    const aLabel = document.createElement('div');
    aLabel.className = 'section-label';
    aLabel.textContent = 'Ejercicios de hoy';
    panel.appendChild(aLabel);
    activeNames.forEach(name => panel.appendChild(circuitExerciseRow(name)));
  }

  const pickLabel = document.createElement('div');
  pickLabel.className = 'section-label';
  pickLabel.textContent = 'Añadir al circuito';
  panel.appendChild(pickLabel);

  const conflictHint = document.createElement('div');
  conflictHint.className = 'section-hint';
  conflictHint.innerHTML = 'Los ejercicios con <b>⚠</b> sobrecargarían la musculatura que ya has trabajado hoy.';
  panel.appendChild(conflictHint);

  day.tiers.forEach(tier => {
    const remaining = tier.items.filter(i => !(i in circuitExercises));
    if(!remaining.length) return;
    const block = document.createElement('div');
    block.className = 'tier-block';
    const label = document.createElement('div');
    label.className = 'tier-label ' + tier.cls;
    label.innerHTML = `<span class="tier-dot"></span>${tier.label}`;
    block.appendChild(label);
    const chips = document.createElement('div');
    chips.className = 'chips';
    remaining.forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      
      // CHEQUEO DE CONFLICTOS
      const isConflict = CONFLICTS[activeDay] && CONFLICTS[activeDay].includes(item);
      if(isConflict){
        chip.classList.add('warn');
      }

      const last = lastCircuitExercise(item);
      let staleTxt = '';
      if(!last) {
        staleTxt = '<span class="stale">nunca</span>';
      } else {
        const d = daysBetween(last.date, sessionDate);
        staleTxt = `<span class="stale">${d}d</span>`;
      }
      
      chip.innerHTML = (isConflict ? '<span style="color:var(--rust)">⚠</span> ' : '+ ') + item + staleTxt;
      chip.onclick = () => {
        circuitExercises[item] = { weight:'', comment:'' };
        renderPanel();
      };
      chips.appendChild(chip);
    });
    block.appendChild(chips);
    panel.appendChild(block);
  });

  const saveRow = document.createElement('div');
  saveRow.className = 'save-row';
  const btn = document.createElement('button');
  btn.className = 'save-btn';
  btn.textContent = 'Guardar sesión de hoy';
  btn.onclick = saveSession;
  const msg = document.createElement('div');
  msg.className = 'save-msg';
  msg.id = 'saveMsg';
  saveRow.appendChild(btn);
  saveRow.appendChild(msg);
  panel.appendChild(saveRow);

  host.appendChild(panel);
}

async function saveSession(){
  const principalsOut = Object.keys(principalState).map(name => {
    const st = principalState[name];
    return { name, weight: st.weight, reps: st.reps.slice(0, st.setsCount), comment: st.comment };
  });

  const hasCircuitConfig = Object.values(circuitConfig).some(v => v !== '');
  const circuitExOut = Object.keys(circuitExercises).map(name => ({
    name, weight: circuitExercises[name].weight, comment: circuitExercises[name].comment
  }));
  const circuitOut = (hasCircuitConfig || circuitExOut.length) ? {
    rounds: circuitConfig.rounds, workSec: circuitConfig.workSec,
    restEx: circuitConfig.restEx, restRounds: circuitConfig.restRounds,
    exercises: circuitExOut
  } : null;

  const now = new Date();
  const [y, m, d] = sessionDate.split('-').map(Number);
  const entryDate = new Date(y, m - 1, d, now.getHours(), now.getMinutes(), now.getSeconds());

  const entry = { day: activeDay, date: entryDate.toISOString(), principals: principalsOut, circuit: circuitOut };
  const msg = document.getElementById('saveMsg');
  msg.textContent = 'guardando…';

  const snapshotPrincipals = JSON.parse(JSON.stringify(principalState));
  const snapshotCircuitConfig = JSON.parse(JSON.stringify(circuitConfig));
  const snapshotCircuitEx = JSON.parse(JSON.stringify(circuitExercises));
  const snapshotDate = sessionDate;

  history.push(entry);
  const ok = await saveHistory();
  if(ok){
    msg.textContent = '✓ Guardado permanentemente';
    editingEntry = null;
    resetDayState();
    renderPanel();
    renderHistory();
  } else {
    history.pop();
    principalState = snapshotPrincipals;
    circuitConfig = snapshotCircuitConfig;
    circuitExercises = snapshotCircuitEx;
    sessionDate = snapshotDate;
    msg.textContent = '✕ Error al guardar';
  }
}

function weekKey(dateStr){
  const d = new Date(dateStr);
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  monday.setHours(0,0,0,0);
  return monday.toISOString().slice(0,10);
}

function weekLabel(mondayStr){
  const monday = new Date(mondayStr);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
  return `Semana ${fmt(monday)} – ${fmt(sunday)}`;
}

function renderHistory(){
  const host = document.getElementById('histList');
  host.innerHTML = '';
  if(!history.length){
    host.innerHTML = '<div class="empty">Aún no hay sesiones guardadas.</div>';
    return;
  }
  
  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  let currentWeek = null;
  sorted.forEach(h => {
    const wk = weekKey(h.date);
    if(wk !== currentWeek){
      currentWeek = wk;
      const divider = document.createElement('div');
      divider.className = 'week-divider';
      divider.innerHTML = `<div class="label">${weekLabel(wk)}</div><div class="line"></div>`;
      host.appendChild(divider);
    }
    const row = document.createElement('div');
    row.className = 'hist-entry';
    const date = new Date(h.date);
    const dateStr = date.toLocaleDateString('es-ES', {weekday:'short', day:'2-digit', month:'short'});

    let html = `<div class="hist-head"><span class="hist-day">${h.day}</span><span class="hist-date">${dateStr}</span>
      <span class="hist-actions"><span class="hist-action edit" data-action="edit">editar</span><span class="hist-action del" data-action="del">eliminar</span></span></div>`;

    if(h.principals && h.principals.length){
      html += `<div class="hist-sub">Fijos</div>`;
      h.principals.forEach(p => {
        const repsTxt = (p.reps || []).filter(r => r !== '').join(', ') || '–';
        html += `<div class="hist-ex"><span class="n">${p.name}</span>
          <span class="v">${repsTxt} reps @ ${p.weight || '–'}kg</span>
          ${p.comment ? `<span class="c">"${p.comment}"</span>` : ''}</div>`;
      });
    }

    if(h.circuit){
      const c = h.circuit;
      const cfgParts = [];
      if(c.rounds) cfgParts.push(`${c.rounds} series`);
      if(c.workSec) cfgParts.push(`${c.workSec}s trabajo`);
      if(c.restEx) cfgParts.push(`${c.restEx}s desc. ejerc.`);
      if(c.restRounds) cfgParts.push(`${c.restRounds}s desc. series`);
      html += `<div class="hist-sub">Circuito</div>`;
      if(cfgParts.length) html += `<div class="hist-circuit-cfg">${cfgParts.join(' · ')}</div>`;
      (c.exercises || []).forEach(e => {
        html += `<div class="hist-ex"><span class="n">${e.name}</span>
          <span class="v">${e.weight ? e.weight + 'kg' : 'sin peso'}</span>
          ${e.comment ? `<span class="c">"${e.comment}"</span>` : ''}</div>`;
      });
    }

    row.innerHTML = html;
    row.querySelector('[data-action="edit"]').onclick = () => loadEntryForEditing(h);
    row.querySelector('[data-action="del"]').onclick = () => {
      if(confirmingDelete === h){
        deleteEntry(h);
        confirmingDelete = null;
      } else {
        confirmingDelete = h;
        renderHistory();
      }
    };
    if(confirmingDelete === h){
      const confirmDiv = document.createElement('div');
      confirmDiv.style.cssText = 'margin-top:4px;font-size:10px;color:var(--rust);font-family:IBM Plex Mono,monospace;';
      confirmDiv.textContent = '⚠ Pulsa "eliminar" para confirmar';
      row.appendChild(confirmDiv);
    }
    host.appendChild(row);
  });
}

document.getElementById('resetBtn').onclick = () => {
  const host = document.getElementById('resetConfirm');
  host.innerHTML = `
    <div class="reset-confirm-box">
      <p>¿Borrar todo el historial?</p>
      <div class="btns">
        <button class="btn-confirm-yes" id="confirmYes">Sí, borrar</button>
        <button class="btn-confirm-no" id="confirmNo">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('confirmYes').onclick = async () => {
    history = [];
    await saveHistory();
    host.innerHTML = '';
    renderHistory();
    resetDayState();
    renderPanel();
  };
  document.getElementById('confirmNo').onclick = () => { host.innerHTML = ''; };
};

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
};
document.getElementById('settingsToggle').onclick = () => {
  settingsOpen = !settingsOpen;
  document.getElementById('settingsToggle').textContent = settingsOpen ? '⚙ Cerrar edición' : '⚙ Editar ejercicios';
  renderSettingsPanel();
};

async function initApp(){
  loadConfig();
  await loadHistory();
  resetDayState();
  renderTabs();
  renderPanel();
}

initApp();
</script>
