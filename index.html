<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rotación de Rutina</title>
<style>
  :root{
    --bg: #1b1f24;
    --bg-panel: #22272e;
    --bg-chip: #2b323a;
    --bg-input: #1a1e23;
    --line: #384049;
    --text: #e9e6df;
    --text-dim: #9aa2ab;
    --ochre: #c9973a;
    --teal: #4f8b8f;
    --rust: #b5533c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    padding:14px 10px 190px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;margin:0;}
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:14px;}
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ochre);margin-bottom:2px;
  }
  header h1{font-size:26px;line-height:1;}
  header p{color:var(--text-dim);font-size:12px;margin-top:4px;line-height:1.3;}

  .banner{
    border-radius:6px;padding:8px 10px;font-size:11.5px;margin-bottom:12px;
    font-family:'IBM Plex Mono',monospace;line-height:1.4;
  }
  .banner.error{background:rgba(181,83,60,.15);border:1px solid rgba(181,83,60,.5);color:#e8a893;}
  .banner.ok{background:rgba(79,139,143,.12);border:1px solid rgba(79,139,143,.4);color:var(--teal);}

  .day-tabs{display:flex;gap:6px;margin:12px 0 12px;}
  .day-tab{
    flex:1;padding:8px 4px;background:var(--bg-panel);border:1px solid var(--line);
    border-radius:6px;text-align:center;cursor:pointer;transition:.15s;
  }
  .day-tab .letter{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;line-height:1;}
  .day-tab .name{font-size:9.5px;color:var(--text-dim);margin-top:2px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-tab.active{border-color:var(--ochre);background:rgba(201,151,58,.1);}
  .day-tab.active .letter{color:var(--ochre);}

  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;}
  .panel h2{font-size:20px;margin-bottom:1px;}
  .panel .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}

  .section-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ochre);margin:12px 0 6px;display:flex;align-items:center;gap:6px;
  }
  .section-label.first{margin-top:0;}
  .section-hint{font-size:10.5px;color:var(--text-dim);margin:-2px 0 8px;font-style:italic;}

  /* --- Principal exercise card --- */
  .ex-row{
    background:var(--bg-chip);border:1px solid var(--line);border-radius:8px;
    padding:10px 10px 8px;margin-bottom:8px;
  }
  .ex-row .ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px;}
  .ex-name{font-size:13px;font-weight:600;}
  .ex-last{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-dim);text-align:right;line-height:1.3;}
  .ex-last .comment{color:var(--ochre);display:block;}

  .row-line{display:flex;gap:6px;margin-bottom:6px;align-items:flex-end;}
  .field-wrap{flex:1;min-width:0;}
  .field-wrap label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px;}

  /* PREVENCIÓN DE ZOOM */
  input, textarea, select {
    background:var(--bg-input);border:1px solid var(--line);border-radius:5px;
    color:var(--text);font-family:'IBM Plex Mono',monospace;
    padding:6px 8px;width:100%;
    font-size:16px !important;
  }
  input::placeholder, textarea::placeholder{color:#5a626b;}
  textarea{resize:none;font-family:'Inter',sans-serif;height:36px;}

  .sets-block label.sets-label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}
  .sets-grid{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
  .set-input-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:38px;}
  .set-input-wrap span{font-size:8.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .set-input-wrap input{text-align:center;padding:5px 2px;}

  .ex-remove{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--rust);cursor:pointer;margin-top:4px;text-align:right;}

  /* --- Circuit config --- */
  .circuit-config{
    background:var(--bg-chip);border:1px solid var(--line);border-radius:8px;
    padding:10px;margin-bottom:10px;
  }
  .circuit-config-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .circuit-config-grid.three{grid-template-columns:1fr 1fr 1fr;}

  .tier-block{margin-bottom:8px;}
  .tier-label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--text-dim);margin-bottom:5px;display:flex;align-items:center;gap:4px;
  }
  .tier-dot{width:5px;height:5px;border-radius:50%;display:inline-block;}
  .tier-1 .tier-dot{background:var(--teal);}
  .tier-2 .tier-dot{background:var(--ochre);}
  .tier-3 .tier-dot{background:var(--rust);}
  .tier-4 .tier-dot{background:#8b949e;}

  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{
    background:var(--bg-input);border:1px dashed var(--line);color:var(--text-dim);
    padding:5px 9px;border-radius:12px;font-size:11.5px;cursor:pointer;transition:.12s;
  }
  .chip:hover{border-color:var(--teal);color:var(--text);}

  /* EJERCICIOS CON CONFLICTO */
  .chip.warn{opacity:0.6; border-color:var(--rust); color:var(--text-dim);}
  .chip.warn:hover{opacity:1; color:var(--rust); border-color:var(--rust);}

  .chip .stale{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--ochre);margin-left:3px;}

  .save-row{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .save-btn{
    background:var(--ochre);color:#20160a;border:none;border-radius:6px;
    padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
    letter-spacing:.02em;cursor:pointer;width:100%;
  }
  .save-btn:active{transform:scale(.98);}
  .save-msg{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-align:center;}

  .history h3{font-size:16px;margin-bottom:8px;}
  .week-divider{display:flex;align-items:center;gap:8px;margin:12px 0 8px;}
  .week-divider:first-child{margin-top:0;}
  .week-divider .line{flex:1;height:1px;background:var(--line);}
  .week-divider .label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ochre);
    text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
  }
  .hist-entry{padding:8px 0;border-bottom:1px solid var(--line);}
  .hist-entry:last-child{border-bottom:none;}
  .hist-head{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
  .hist-day{color:var(--ochre);font-weight:600;font-size:12px;}
  .hist-date{font-family:'IBM Plex Mono',monospace;color:var(--text-dim);font-size:10.5px;}
  .hist-actions{margin-left:auto;display:flex;gap:8px;}
  .hist-action{font-family:'IBM Plex Mono',monospace;font-size:9.5px;cursor:pointer;text-decoration:underline;}
  .hist-action.edit{color:var(--teal);}
  .hist-action.del{color:var(--rust);}
  .editing-banner{
    background:rgba(201,151,58,.12);border:1px solid rgba(201,151,58,.4);color:var(--ochre);
    border-radius:6px;padding:8px 10px;font-size:11px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .editing-banner button{
    background:none;border:1px solid var(--ochre);color:var(--ochre);border-radius:4px;
    padding:4px 8px;font-size:9.5px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .hist-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px;}
  .hist-ex{font-size:11.5px;margin-bottom:3px;}
  .hist-ex .n{color:var(--text);font-weight:500;}
  .hist-ex .v{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);display:block;}
  .hist-ex .c{color:var(--ochre);font-size:10.5px;font-style:italic;display:block;}
  .hist-circuit-cfg{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--teal);margin-bottom:4px;}
  .empty{color:var(--text-dim);font-size:12px;font-style:italic;padding:8px 0;}
  .reset{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    border-radius:5px;padding:6px 10px;font-size:10.5px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .reset-confirm-box{
    margin-top:8px;padding:10px;border:1px solid var(--rust);border-radius:6px;
    background:rgba(181,83,60,.1);font-size:11.5px;
  }
  .reset-confirm-box p{margin:0 0 8px;color:var(--text);}
  .reset-confirm-box .btns{display:flex;gap:6px;}
  .reset-confirm-box button{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;border-radius:4px;
    padding:5px 10px;cursor:pointer;border:1px solid var(--line);
  }
  .btn-confirm-yes{background:var(--rust);color:#fff;border-color:var(--rust);}
  .btn-confirm-no{background:none;color:var(--text-dim);}

  .tier-5 .tier-dot{background:#7c9a6d;}
  .tier-6 .tier-dot{background:#8a6fb0;}
  .tier-7 .tier-dot{background:#c27a9a;}
  .tier-8 .tier-dot{background:#d08a5a;}
  .tier-9 .tier-dot{background:#5b9bd5;}
  .slot-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .ex-hint{font-size:10.5px;color:var(--text-dim);font-style:italic;margin:-2px 0 6px;}
  .ex-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:4px;}
  .ex-swap{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--teal);cursor:pointer;}
  .ex-remove-inline{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--rust);cursor:pointer;}
  .circuit-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 4px;flex-wrap:wrap;}
  .check-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text);cursor:pointer;}
  .check-line input[type=checkbox]{width:auto;height:auto;margin:0;}
  .chip .stale + .stale{margin-left:4px;color:var(--rust);}
  details.picker{margin-top:10px;}
  details.picker summary{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--teal);cursor:pointer;padding:6px 0;}
  select{appearance:auto;}

  /* --- Temporizador --- */
  .timer-box{border-radius:10px;padding:16px 12px;text-align:center;border:1px solid var(--line);margin:8px 0 10px;}
  .timer-work{background:rgba(181,83,60,.18);border-color:var(--rust);}
  .timer-rest{background:rgba(79,139,143,.15);border-color:var(--teal);}
  .timer-prep{background:rgba(201,151,58,.12);border-color:var(--ochre);}
  .timer-paused{opacity:.6;}
  .timer-phase{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--text-dim);}
  .timer-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;margin:4px 0 0;}
  .timer-clock{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:500;line-height:1.1;margin:4px 0;}
  .timer-target{font-family:'Barlow Condensed',sans-serif;font-size:64px;font-weight:700;line-height:1;margin:6px 0 0;}
  .timer-target-unit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .timer-detail{font-size:11.5px;color:var(--text-dim);}
  .timer-controls{display:flex;gap:6px;}
  .timer-controls .reset{flex:1;padding:10px 6px;font-size:12px;}
  .timer-done-btn{margin-bottom:8px;padding:14px;font-size:20px;}
  .save-btn:disabled{opacity:.4;cursor:not-allowed;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;}
  .stepper .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;width:100%;text-align:center;}
  .stepper-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .stepper button{
    background:var(--bg-input);border:1px solid var(--line);color:var(--text);border-radius:6px;
    width:44px;height:38px;font-size:20px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .stepper .val{font-family:'IBM Plex Mono',monospace;font-size:24px;min-width:48px;text-align:center;}

  .day-tab .name{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;font-size:9px;}
  .circuit-controls{justify-content:flex-end;}

  /* --- Edición de ejercicios --- */
  .dose-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .dose-row .nm{flex:1;font-size:12px;min-width:0;line-height:1.25;}
  .dose-row .nm .tag-day{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--teal);margin-left:4px;}
  .dose-row .nm .dm{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);display:block;}
  .dose-row input.dv{width:58px;text-align:center;padding:5px 2px;}
  .dose-row select.du{width:112px;padding:5px 4px;}
  .dose-row .rm{color:var(--rust);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:0 4px;}
  .blocked-line{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--rust);margin:-6px 0 10px;}

  /* --- Pantalla activa --- */
  .awake-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--teal);text-align:center;margin:0 0 8px;cursor:pointer;}
  .awake-badge.warn{color:var(--ochre);}

  /* --- Barra de descanso de los fijos (fija abajo) --- */
  .restbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg-panel);border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.35);}
  .restbar.running{border-top:2px solid var(--teal);}
  .restbar.finished{border-top:2px solid var(--ochre);background:#2c2a22;}
  .rest-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px;}
  .rest-row{display:flex;align-items:center;gap:6px;}
  .rest-row .grow{flex:1;}
  .rest-title{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;}
  .rest-count{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;min-width:84px;text-align:center;}
  .rest-mini{background:var(--bg-input);border:1px solid var(--line);color:var(--text);border-radius:5px;min-width:34px;height:30px;font-size:17px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .rest-chip{flex:1;background:var(--bg-input);border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:9px 0;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;}
  .rest-chip.on{border-color:var(--ochre);color:var(--ochre);background:rgba(201,151,58,.12);}
  .rest-chip:disabled{opacity:.45;}
  .rest-go{flex:1.8;background:var(--ochre);color:#20160a;border:none;border-radius:6px;padding:9px 6px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;cursor:pointer;}
  .rest-go.stop{background:var(--rust);color:#fff;}
  .rest-clock{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;line-height:1;}
  .rest-msg{font-size:11.5px;color:var(--text-dim);}
  .restbar .awake-badge{margin:0;text-align:right;font-size:9px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Rotación 3 días · en casa</div>
    <h1>Tu bloque de hoy</h1>
    <p>Fijos: series, peso y reps. Accesorios: circuito con dosis por ejercicio (reps o tiempo).</p>
  </header>

  <div id="storageBanner"></div>
  <div class="day-tabs" id="dayTabs"></div>
  <div style="margin-bottom:12px;">
    <button class="reset" id="settingsToggle" style="width:100%;">⚙ Editar ejercicios</button>
  </div>
  <div id="settingsPanel"></div>
  <div id="panelHost"></div>
  <div id="timerHost"></div>

  <div class="panel history">
    <h3>Historial</h3>
    <div id="histList"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
      <button class="reset" id="exportBtn">⬇ Exportar</button>
      <button class="reset" id="importBtn">⬆ Importar</button>
      <button class="reset" id="resetBtn">Borrar todo</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div id="resetConfirm"></div>
  </div>
</div>

<div id="restBar" class="restbar"></div>

<script>
// =====================================================================
//  UNIDADES DE DOSIS, GRUPOS Y MÚSCULOS
// =====================================================================
const UNITS = {
  reps:   'reps',
  lado:   'reps por lado',
  seg:    'segundos',
  segLado:'seg por lado',
  m:      'metros'
};
const MANUAL_UNITS = ['reps', 'lado', 'm'];       // se confirman con el botón Hecho
const ADJUST_STEP  = { reps:1, lado:1, m:5 };     // paso del +/- de reps realizadas
const ADJUST_LABEL = { reps:'Reps realizadas', lado:'Reps realizadas (por lado)', m:'Metros realizados' };

// Grupos = cómo se muestran y de dónde tira cada hueco del circuito
const GROUPS = [
  { key:'empuje',     label:'Empuje',                 cls:'tier-3' },
  { key:'triceps',    label:'Tríceps',                cls:'tier-8' },
  { key:'traccion',   label:'Tracción',               cls:'tier-2' },
  { key:'biceps',     label:'Bíceps',                 cls:'tier-9' },
  { key:'cuadriceps', label:'Cuádriceps y gemelos',   cls:'tier-5' },
  { key:'posterior',  label:'Cadena posterior',       cls:'tier-1' },
  { key:'core',       label:'Core',                   cls:'tier-6' },
  { key:'carry',      label:'Carry',                  cls:'tier-7' },
  { key:'cuerpo',     label:'Cuerpo completo',        cls:'tier-4' }
];
// Músculo primario por defecto de un ejercicio añadido a mano según su grupo
const GROUP_PRIMARY = {
  empuje:'empuje', triceps:'triceps', traccion:'traccion', biceps:'biceps',
  cuadriceps:'cuadriceps', posterior:'posterior', core:'core', carry:'carry', cuerpo:'cuadriceps'
};
const MUSCLE_LABEL = {
  empuje:'empuje', triceps:'tríceps', traccion:'tracción', biceps:'bíceps',
  cuadriceps:'cuádriceps', posterior:'cadena posterior', core:'core', carry:'carry', gemelos:'gemelos'
};
const DEMAND_RANK = { baja:0, media:1, alta:2 };

// =====================================================================
//  CATÁLOGO DE ACCESORIOS
//  group = de dónde tira el hueco · primary = músculo que carga
//  secondary = músculos que también carga · grip = agarre · iso = isométrico
//  days = solo puede salir en esos días · unit/value = dosis por defecto
// =====================================================================
function X(name, group, primary, secondary, demand, unit, value, o){
  return Object.assign({ name, group, primary, secondary: secondary || [], demand, unit, value,
                         grip:false, iso:false, days:null }, o || {});
}
const DEFAULT_CATALOG = [
  // Empuje
  X('Flexiones', 'empuje','empuje',['triceps'],'media','reps',10),
  X('Flexiones con manos elevadas', 'empuje','empuje',['triceps'],'media','reps',12),
  X('Flexiones con rotación (T push-up)', 'empuje','empuje',['core'],'media','reps',8),
  X('Press militar alterno', 'empuje','empuje',['triceps'],'media','lado',10),
  X('Elevaciones laterales', 'empuje','empuje',[],'baja','reps',12),
  X('Fondos en banco', 'empuje','empuje',['triceps'],'media','reps',12),
  // Tríceps
  X('Extensión de tríceps en barra baja', 'triceps','triceps',[],'media','reps',8),
  X('Extensión de tríceps sobre la cabeza', 'triceps','triceps',[],'baja','reps',12),
  // Tracción
  X('High Pulls', 'traccion','traccion',[],'media','reps',12,{grip:true}),
  X('Gorilla row', 'traccion','traccion',[],'media','lado',8,{grip:true}),
  X('Curl + Pull over', 'traccion','traccion',['biceps'],'media','reps',12),

function exportBackup(){
  const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `rutina-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed)) throw new Error('formato inválido');
      const merge = confirm('¿Fusionar con tu historial actual? Aceptar = fusionar, Cancelar = reemplazar todo.');
      if(merge){
        const existingKeys = new Set(history.map(h => h.date + '|' + h.day));
        parsed.forEach(p => {
          if(!existingKeys.has(p.date + '|' + p.day)) history.push(p);
        });
      } else {
        history = parsed;
      }
      await saveHistory();
      renderHistory();
      resetDayState();
      renderPanel();
      showBanner('ok', '✓ Copia importada correctamente.');
    }catch(err){
      showBanner('error', '⚠ El archivo no es válido.');
    }
  };
  reader.readAsText(file);
}

function daysBetween(dateStrStart, dateStrEnd){
  const d1 = new Date(dateStrStart.slice(0,10) + 'T00:00:00');
  const d2 = new Date(dateStrEnd.slice(0,10) + 'T00:00:00');
  return Math.floor((d2.getTime() - d1.getTime()) / 86400000);
}

function normCustom(e){
  const group = GROUPS.some(g => g.key === e.group) ? e.group : 'cuerpo';
  return {
    name: e.name, group,
    primary: e.primary || GROUP_PRIMARY[group] || 'core',
    secondary: Array.isArray(e.secondary) ? e.secondary : [],
    demand: e.demand in DEMAND_RANK ? e.demand : 'media',
    unit: e.unit in UNITS ? e.unit : 'reps',
    value: Number(e.value) > 0 ? Number(e.value) : 10,
    grip: !!e.grip, iso: !!e.iso, days: Array.isArray(e.days) ? e.days : null
  };
}

function rebuildCatalog(){
  CATALOG = DEFAULT_CATALOG
    .filter(e => !removedNames.some(n => sameName(n, e.name)))
    .concat(customAdded.map(normCustom).filter(e => !DEFAULT_CATALOG.some(d => sameName(d.name, e.name))));
}

function validCustom(e){
  return e && typeof e.name === 'string' && e.name.trim() && GROUPS.some(g => g.key === e.group)
    && e.demand in DEMAND_RANK;
}

// Convierte los ejercicios añadidos a mano en la versión anterior (por patrón) al nuevo formato
const LEGACY_GROUP = { empuje:'empuje', traccion:'traccion', bisagra:'posterior', pierna:'cuadriceps', core:'core', carry:'carry', cuerpo:'cuerpo' };
function migrateCustom(e){
  if(!e || typeof e.name !== 'string') return null;
  const group = LEGACY_GROUP[e.pattern] || 'cuerpo';
  return { name: e.name, group, demand: e.demand, unit:'reps', value:10 };
}

function applyConfig(cfg, legacy){
  if(cfg.principals){
    Object.keys(cfg.principals).forEach(day => {
      const arr = cfg.principals[day];
      if(DAYS[day] && Array.isArray(arr) && arr.length && arr.every(x => typeof x === 'string' && x.trim())){
        DAYS[day].principals = arr.slice();
      }
    });
  }
  if(Array.isArray(cfg.added)){
    customAdded = cfg.added.map(e => legacy ? migrateCustom(e) : e).filter(validCustom).map(normCustom);
  }
  if(Array.isArray(cfg.removed)) removedNames = cfg.removed.filter(n => typeof n === 'string');
  if(!legacy && cfg.doses && typeof cfg.doses === 'object'){
    Object.keys(cfg.doses).forEach(n => {
      const d = cfg.doses[n];
      if(d && d.unit in UNITS && Number(d.value) > 0) doseOverrides[n] = { unit: d.unit, value: Number(d.value) };
    });
  }
}

function loadConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if(raw){
      applyConfig(JSON.parse(raw), false);
    } else {
      const old = localStorage.getItem(OLD_CONFIG_KEY);
      if(old){
        applyConfig(JSON.parse(old), true);
        saveConfig();
      }
    }
  }catch(e){}
  rebuildCatalog();
}

function saveConfig(){
  const principals = {};
  Object.keys(DAYS).forEach(d => {
    if(JSON.stringify(DAYS[d].principals) !== JSON.stringify(DEFAULT_PRINCIPALS[d])){
      principals[d] = DAYS[d].principals;
    }
  });
  const cfg = { principals, added: customAdded, removed: removedNames, doses: doseOverrides };
  try{ localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(cfg)); }catch(e){}
}

function findCatalog(name){
  return CATALOG.find(e => sameName(e.name, name)) || DEFAULT_CATALOG.find(e => sameName(e.name, name)) || null;
}

function getDose(name){
  const ov = Object.keys(doseOverrides).find(n => sameName(n, name));
  if(ov) return doseOverrides[ov];
  const e = findCatalog(name);
  return e ? { unit: e.unit, value: e.value } : { unit:'reps', value:10 };
}

function setDoseOverride(name, unit, value){
  const v = Number(String(value).replace(',', '.'));
  const key = Object.keys(doseOverrides).find(n => sameName(n, name)) || name;
  if(!(unit in UNITS) || !(v > 0)){ return; }
  const def = findCatalog(name);
  if(def && def.unit === unit && def.value === v) delete doseOverrides[key];
  else doseOverrides[key] = { unit, value: v };
  saveConfig();
}

function doseText(unit, value){
  const v = String(value).trim();
  if(!unit || v === '') return '';
  switch(unit){
    case 'reps':    return `${v} reps`;
    case 'lado':    return `${v} reps/lado`;
    case 'seg':     return `${v} s`;
    case 'segLado': return `${v} s/lado`;
    case 'm':       return `${v} m`;
  }
  return v;
}

function lastPrincipalEntry(name){
  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  for(let i = 0; i < sorted.length; i++){
    if(sorted[i].date.slice(0,10) <= sessionDate){
      const found = (sorted[i].principals || []).find(e => sameName(e.name, name));
      if(found) return { date: sorted[i].date, ...found };
    }
  }
  return null;
}

function lastCircuitExercise(name){
  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  for(let i = 0; i < sorted.length; i++){
    if(sorted[i].date.slice(0,10) <= sessionDate){
      const c = sorted[i].circuit;
      if(!c) continue;
      const found = (c.exercises || []).find(e => sameName(e.name, name));
      if(found) return { date: sorted[i].date, ...found };
    }
  }
  return null;
}

// Ejercicios usados en las últimas N sesiones del mismo día
function recentNames(day, n){
  const names = new Set();
  history
    .filter(h => h.day === day && h.circuit && h.date.slice(0,10) <= sessionDate)
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, n)
    .forEach(s => (s.circuit.exercises || []).forEach(e => names.add(norm(e.name))));
  return names;
}

function staleness(name){
  const last = lastCircuitExercise(name);
  return last ? daysBetween(last.date, sessionDate) : 9999;
}

// =====================================================================
//  REGLAS Y SELECCIÓN DEL CIRCUITO
// =====================================================================
function blockedSet(day){ return new Set(DAY_RULES[day].block); }

// Ligero: su músculo primario ya lo cargan los fijos, pero está en la lista de ligeros del día (baja demanda)
function isLight(day, ex){
  const soft = DAY_RULES[day].soft || [];
  return blockedSet(day).has(ex.primary) && soft.some(n => sameName(n, ex.name));
}
// Bloqueo duro: músculo primario ya cargado por los fijos (salvo ligeros), o ejercicio restringido a otro día
function hardBlocked(day, ex){
  if(blockedSet(day).has(ex.primary) && !isLight(day, ex)) return true;
  if(ex.days && !ex.days.includes(day)) return true;
  return false;
}
// Carga como secundario algo que los fijos ya cargan
function secBlocked(day, ex){
  const b = blockedSet(day);
  return (ex.secondary || []).some(m => b.has(m));
}
// 0 = ok, 1 = carga secundaria ya trabajada, 2 = bloqueado
function conflictLevel(day, ex){
  if(hardBlocked(day, ex)) return 2;
  if(isLight(day, ex) || secBlocked(day, ex)) return 1;
  return 0;
}

// ¿Se puede añadir ex al circuito? others = ejercicios ya elegidos, neighbors = los de los huecos contiguos
function canAdd(ex, day, others, neighbors){
  const rules = DAY_RULES[day];
  if(hardBlocked(day, ex)) return false;
  if(ex.grip && others.filter(o => o.grip).length + 1 > rules.gripMax) return false;
  if(ex.iso && others.filter(o => o.iso).length + 1 > MAX_ISO) return false;
  if(others.filter(o => o.primary === ex.primary).length >= MAX_PER_MUSCLE) return false;
  if(neighbors.some(n => n.primary === ex.primary)) return false;
  if(EXCL_PAIRS.some(([a, b]) =>
      (sameName(ex.name, a) && others.some(o => sameName(o.name, b))) ||
      (sameName(ex.name, b) && others.some(o => sameName(o.name, a))))) return false;
  if(secBlocked(day, ex) && others.filter(o => secBlocked(day, o)).length + 1 > MAX_SEC_BLOCKED) return false;
  if(isLight(day, ex) && others.filter(o => isLight(day, o)).length + 1 > MAX_LIGHT) return false;
  return true;
}

function pickFor(slot, random, others, neighbors){
  const used = new Set(others.map(o => norm(o.name)));
  const recent = recentNames(activeDay, 2);
  let base = CATALOG.filter(e =>
    slot.groups.includes(e.group) &&
    !used.has(norm(e.name)) && !sessionSkipped.has(norm(e.name)) &&
    canAdd(e, activeDay, others, neighbors));
  if(slot.demand){
    const pref = base.filter(e => e.demand === slot.demand);
    if(pref.length) base = pref;
  }
  const clean = e => !secBlocked(activeDay, e);
  const fresh = e => !recent.has(norm(e.name));
  const tiers = [
    base.filter(e => clean(e) && fresh(e)),
    base.filter(fresh),
    base.filter(clean),
    base
  ];
  // Al volver a proponer se abre el abanico (incluye los de carga secundaria, máx. 1) para dar variedad
  const pool = random
    ? (tiers[1].length ? tiers[1] : tiers.find(t => t.length))
    : tiers.find(t => t.length);
  if(!pool) return null;
  if(random) return pool[Math.floor(Math.random() * pool.length)];
  return pool
    .map(e => ({ e, s: staleness(e.name), r: Math.random() }))
    .sort((a, b) => (b.s - a.s) || (a.r - b.r))[0].e;
}

function makeItem(ex, slotIdx){
  const d = getDose(ex.name);
  const slot = slotIdx != null ? DAY_RULES[activeDay].slots[slotIdx] : null;
  return {
    name: ex.name, weight:'', comment:'',
    slot: slot ? slot.label : null, slotIdx: slotIdx,
    unit: d.unit, target: String(d.value), done: []
  };
}

function proposeCircuit(randomize){
  sessionSkipped = new Set();
  circuitNote = '';
  const slots = DAY_RULES[activeDay].slots;
  // Primero los huecos con menos opciones, para que no se queden sin candidatos
  const order = slots
    .map((s, i) => ({ i, n: CATALOG.filter(e => s.groups.includes(e.group) && !hardBlocked(activeDay, e)).length }))
    .sort((a, b) => a.n - b.n)
    .map(x => x.i);
  // Algunas combinaciones dejan un hueco sin candidatos: se reintenta y se queda con la mejor
  let best = null, bestCount = -1;
  for(let attempt = 0; attempt < 30; attempt++){
    const filled = new Array(slots.length).fill(null);
    order.forEach(i => {
      const others = filled.filter(Boolean);
      const neighbors = [filled[i - 1], filled[i + 1]].filter(Boolean);
      const ex = pickFor(slots[i], !!randomize || attempt > 0, others, neighbors);
      if(ex) filled[i] = ex;
    });
    const count = filled.filter(Boolean).length;
    if(count > bestCount){ best = filled; bestCount = count; }
    if(count === slots.length) break;
  }
  const filled = best;
  circuitItems = filled.map((ex, i) => ex ? makeItem(ex, i) : null).filter(Boolean);
  if(circuitItems.length < slots.length){
    circuitNote = 'Algún hueco se ha quedado vacío: no había opciones compatibles con las reglas de hoy.';
  }
}

function swapItem(idx){
  const it = circuitItems[idx];
  if(!it || it.slotIdx == null) return;
  const slot = DAY_RULES[activeDay].slots[it.slotIdx];
  if(!slot) return;
  const others = circuitItems.filter((_, j) => j !== idx).map(i => findCatalog(i.name)).filter(Boolean);
  const neighbors = [circuitItems[idx - 1], circuitItems[idx + 1]].filter(Boolean).map(i => findCatalog(i.name)).filter(Boolean);
  sessionSkipped.add(norm(it.name));
  const ex = pickFor(slot, true, others, neighbors);
  if(!ex){
    sessionSkipped.delete(norm(it.name));
    circuitNote = 'No hay más opciones para ese hueco con las reglas de hoy.';
  } else {
    circuitNote = '';
    circuitItems[idx] = makeItem(ex, it.slotIdx);
  }
  renderPanel();
}

function resetDayState(){
  const day = DAYS[activeDay];
  principalState = {};
  day.principals.forEach(p => {
    const last = lastPrincipalEntry(p);
    const setsCount = last && last.reps ? last.reps.length : (DEFAULT_SETS[p] || 4);
    principalState[p] = { weight:'', setsCount: setsCount, reps: new Array(setsCount).fill(''), comment:'' };
  });
  circuitConfig = { rounds:'3', restEx:'15', restRounds:'60' };
  proposeCircuit();
}

function loadEntryForEditing(entry){
  const idx = history.indexOf(entry);
  if(idx === -1) return;
  history.splice(idx, 1);
  editingEntry = entry;

  activeDay = entry.day;
  sessionDate = entry.date.slice(0,10);

  principalState = {};
  (entry.principals || []).forEach(p => {
    principalState[p.name] = {
      weight: p.weight || '',
      setsCount: (p.reps || []).length || 0,
      reps: (p.reps || []).slice(),
      comment: p.comment || ''
    };
  });

  circuitConfig = entry.circuit
    ? { rounds: entry.circuit.rounds || '', restEx: entry.circuit.restEx || '', restRounds: entry.circuit.restRounds || '' }
    : { rounds:'', restEx:'', restRounds:'' };
  circuitItems = ((entry.circuit && entry.circuit.exercises) || []).map(e => {
    const d = getDose(e.name);
    return {
      name: e.name, weight: e.weight || '', comment: e.comment || '', slot: null, slotIdx: null,
      unit: e.unit in UNITS ? e.unit : d.unit,
      target: e.target != null && e.target !== '' ? String(e.target) : String(d.value),
      done: Array.isArray(e.done) ? e.done.slice() : []
    };
  });
  sessionSkipped = new Set();
  circuitNote = '';

  renderTabs();
  renderPanel();
  renderHistory();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteEntry(entry){
  const idx = history.indexOf(entry);
  if(idx === -1) return;
  history.splice(idx, 1);
  await saveHistory();
  renderHistory();
  resetDayState();
  renderPanel();
}

function removeFromCatalog(name){
  const ia = customAdded.findIndex(e => sameName(e.name, name));
  if(ia >= 0) customAdded.splice(ia, 1);
  else if(!removedNames.some(n => sameName(n, name))) removedNames.push(name);
  rebuildCatalog();
  saveConfig();
}

function addToCatalog(name, group, demand, unit, value){
  if(CATALOG.some(e => sameName(e.name, name))) return false;
  const wasRemoved = removedNames.findIndex(n => sameName(n, name));
  if(wasRemoved >= 0 && DEFAULT_CATALOG.some(d => sameName(d.name, name))){
    removedNames.splice(wasRemoved, 1);
  } else {
    customAdded.push({ name, group, demand, unit, value: Number(String(value).replace(',', '.')) || 10 });
  }
  rebuildCatalog();
  saveConfig();
  return true;
}

function blockedText(day){
  const parts = DAY_RULES[day].block.map(m => MUSCLE_LABEL[m] || m);
  if(DAY_RULES[day].gripMax === 0) parts.push('agarre');
  return parts.join(', ');
}
function lightText(day){
  const soft = DAY_RULES[day].soft || [];
  return soft.length ? ` · Ligeros permitidos (máx. ${MAX_LIGHT}): ${soft.join(', ')}` : '';
}

function unitOptions(selected){
  return Object.keys(UNITS).map(u => `<option value="${u}"${u === selected ? ' selected' : ''}>${UNITS[u]}</option>`).join('');
}

function principalRow(name){
  const st = principalState[name];
  const last = lastPrincipalEntry(name);
  const wrap = document.createElement('div');
  wrap.className = 'ex-row';

  const lastReps = last && last.reps ? last.reps.join(',') : null;
  const daysDiff = last ? daysBetween(last.date, sessionDate) : 0;
  const lastLine = last
    ? `últ: ${lastReps || '–'} reps @ ${last.weight || '–'}kg · ${daysDiff}d`
    : 'sin datos';
  const commentLine = last && last.comment ? `<span class="comment">"${last.comment}"</span>` : '';
  const hint = PRINCIPAL_HINTS[name] ? `<div class="ex-hint">${PRINCIPAL_HINTS[name]}</div>` : '';

  wrap.innerHTML = `
    <div class="ex-top">
      <div class="ex-name">${name}</div>
      <div class="ex-last">${lastLine}${commentLine}</div>
    </div>
    ${hint}
    <div class="row-line">
      <div class="field-wrap">
        <label>Peso (kg)</label>
        <input type="text" inputmode="decimal" placeholder="${last ? last.weight || '—' : '—'}" data-role="weight">
      </div>
      <div class="field-wrap">
        <label>Nº series</label>
        <input type="text" inputmode="numeric" data-role="setsCount" value="${st.setsCount}">
      </div>
    </div>
    <div class="sets-block">
      <label class="sets-label">Reps por serie</label>
      <div class="sets-grid" data-role="setsGrid"></div>
    </div>
    <div class="row-line" style="margin-top:2px;">
      <div class="field-wrap">
        <label>Comentario</label>
        <textarea rows="1" placeholder="ej. subir peso, molestias..." data-role="comment"></textarea>
      </div>
    </div>
  `;

  const weightInput = wrap.querySelector('[data-role="weight"]');
  weightInput.value = st.weight;
  weightInput.oninput = () => { st.weight = weightInput.value; };

  const setsCountInput = wrap.querySelector('[data-role="setsCount"]');
  setsCountInput.oninput = () => {
    let n = parseInt(setsCountInput.value) || 0;
    n = Math.max(0, Math.min(n, 10));
    st.setsCount = n;
    const cur = st.reps;
    const next = new Array(n).fill('');
    for(let i = 0; i < Math.min(n, cur.length); i++) next[i] = cur[i];
    st.reps = next;
    renderSetsGrid();
  };

  const commentInput = wrap.querySelector('[data-role="comment"]');
  commentInput.value = st.comment;
  commentInput.oninput = () => { st.comment = commentInput.value; };

  function renderSetsGrid(){
    const grid = wrap.querySelector('[data-role="setsGrid"]');
    grid.innerHTML = '';
    for(let i = 0; i < st.setsCount; i++){
      const setWrap = document.createElement('div');
      setWrap.className = 'set-input-wrap';
      const lastRepVal = last && last.reps && last.reps[i] ? last.reps[i] : '—';
      setWrap.innerHTML = `<span>S${i+1}</span><input type="text" inputmode="numeric" placeholder="${lastRepVal}">`;
      const inp = setWrap.querySelector('input');
      inp.value = st.reps[i] || '';
      inp.oninput = () => { st.reps[i] = inp.value; };
      grid.appendChild(setWrap);
    }
  }
  renderSetsGrid();

  return wrap;
}

function circuitExerciseRow(it, idx){
  const last = lastCircuitExercise(it.name);
  const cat = findCatalog(it.name);
  const wrap = document.createElement('div');
  wrap.className = 'ex-row';
  const daysDiff = last ? daysBetween(last.date, sessionDate) : 0;
  let lastLine = 'sin datos';
  if(last){
    lastLine = `últ: ${last.weight ? last.weight + 'kg' : 'sin peso'} · ${daysDiff}d`;
    if(last.unit) lastLine += ` · ${doseText(last.unit, last.target)}`;
    if(Array.isArray(last.done) && last.done.length) lastLine += ` · hecho ${last.done.join(',')}`;
  }
  const commentLine = last && last.comment ? `<span class="comment">"${last.comment}"</span>` : '';
  const tagParts = [];
  if(it.slot) tagParts.push(it.slot);
  if(cat) tagParts.push('demanda ' + cat.demand);
  if(cat){
    const lvl = conflictLevel(activeDay, cat);
    if(lvl === 2) tagParts.push('⚠ ya cargado hoy');
    else if(lvl === 1) tagParts.push(isLight(activeDay, cat) ? '⚠ ligero (baja demanda)' : '⚠ carga secundaria');
  }
  const tag = tagParts.length ? `<div class="slot-tag">${idx + 1}. ${tagParts.join(' · ')}</div>` : `<div class="slot-tag">${idx + 1}.</div>`;

  wrap.innerHTML = `
    ${tag}
    <div class="ex-top">
      <div class="ex-name">${it.name}</div>
      <div class="ex-last">${lastLine}${commentLine}</div>
    </div>
    <div class="row-line">
      <div class="field-wrap" style="flex:.8;">

      <div class="field-wrap" style="flex:.9;">
        <label>Peso (kg)</label>
        <input type="text" inputmode="decimal" placeholder="${last && last.weight ? last.weight : '—'}" data-role="weight">
      </div>
    </div>
    <div class="row-line">
      <div class="field-wrap">
        <label>Realizado por ronda (ej. 20,20,18)</label>
        <input type="text" data-role="done" data-idx="${idx}" placeholder="se rellena con el temporizador">
      </div>
    </div>
    <div class="row-line">
      <div class="field-wrap">
        <label>Comentario</label>
        <textarea rows="1" placeholder="ej. fácil, molestias..." data-role="comment"></textarea>
      </div>
    </div>
  `;
  const targetInput = wrap.querySelector('[data-role="target"]');
  targetInput.value = it.target;
  targetInput.oninput = () => { it.target = targetInput.value; };
  targetInput.onchange = () => {
    if(!editingEntry) setDoseOverride(it.name, it.unit, it.target);
  };
  const unitSel = wrap.querySelector('[data-role="unit"]');
  unitSel.onchange = () => {
    it.unit = unitSel.value;
    if(!editingEntry) setDoseOverride(it.name, it.unit, it.target);
    renderTimer();
  };
  const weightInput = wrap.querySelector('[data-role="weight"]');
  weightInput.value = it.weight;
  weightInput.oninput = () => { it.weight = weightInput.value; };
  const doneInput = wrap.querySelector('[data-role="done"]');
  doneInput.value = (it.done || []).join(',');
  doneInput.oninput = () => {
    it.done = doneInput.value.split(',').map(s => s.trim()).filter(s => s !== '');
  };
  const commentInput = wrap.querySelector('[data-role="comment"]');
  commentInput.value = it.comment;
  commentInput.oninput = () => { it.comment = commentInput.value; };

  const actions = document.createElement('div');
  actions.className = 'ex-actions';
  if(it.slotIdx != null && DAY_RULES[activeDay].slots[it.slotIdx]){
    const swap = document.createElement('span');

  }

  removeBtn.className = 'ex-remove-inline';
  removeBtn.textContent = '✕ quitar';
  removeBtn.onclick = () => { circuitItems.splice(idx, 1); circuitNote = ''; renderPanel(); };
  actions.appendChild(removeBtn);
  wrap.appendChild(actions);

  return wrap;
}

  det.appendChild(conflictHint);

  GROUPS.forEach(g => {
    const remaining = CATALOG.filter(e => e.group === g.key && !circuitItems.some(i => sameName(i.name, e.name)));
    if(!remaining.length) return;
    const block = document.createElement('div');
    block.className = 'tier-block';
    const label = document.createElement('div');
    label.className = 'tier-label ' + g.cls;
    label.innerHTML = `<span class="tier-dot"></span>${g.label}`;
    block.appendChild(label);
    const chips = document.createElement('div');
    chips.className = 'chips';
    remaining.forEach(e => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const lvl = conflictLevel(activeDay, e);
      if(lvl > 0) chip.classList.add('warn');
      const last = lastCircuitExercise(e.name);
      const staleTxt = last
        ? `<span class="stale">${daysBetween(last.date, sessionDate)}d</span>`
        : '<span class="stale">nunca</span>';
      chip.innerHTML = (lvl > 0 ? '<span style="color:var(--rust)">⚠</span> ' : '+ ') + e.name + staleTxt;
      chip.onclick = () => {
        const d = getDose(e.name);
        const item = { name: e.name, weight:'', comment:'', slot:null, slotIdx:null, unit:d.unit, target:String(d.value), done:[] };
        // el core va siempre al final: el manual se mete antes si el último ya es core
        const lastIt = circuitItems[circuitItems.length - 1];
        const lastCat = lastIt ? findCatalog(lastIt.name) : null;
        if(lastCat && lastCat.group === 'core' && e.group !== 'core' && !editingEntry){
          circuitItems.splice(circuitItems.length - 1, 0, item);
        } else {
          circuitItems.push(item);
        }
        circuitNote = '';
        renderPanel();
      };
      chips.appendChild(chip);
    });
    block.appendChild(chips);
    det.appendChild(block);
  });
  panel.appendChild(det);

  const saveRow = document.createElement('div');
  saveRow.className = 'save-row';
  const btn = document.createElement('button');
  btn.className = 'save-btn';
  btn.textContent = 'Guardar sesión de hoy';
  btn.onclick = saveSession;
  const msg = document.createElement('div');
  msg.className = 'save-msg';
  msg.id = 'saveMsg';
  saveRow.appendChild(btn);
  saveRow.appendChild(msg);
  panel.appendChild(saveRow);

  host.appendChild(panel);
  renderTimer();
}

async function saveSession(){
  const principalsOut = Object.keys(principalState).map(name => {
    const st = principalState[name];
    return { name, weight: st.weight, reps: st.reps.slice(0, st.setsCount), comment: st.comment };
  });

  const circuitExOut = circuitItems.map(it => ({
    name: it.name, weight: it.weight, comment: it.comment,
    unit: it.unit, target: it.target, done: (it.done || []).slice()
  }));
  const circuitOut = circuitExOut.length ? {
    rounds: circuitConfig.rounds,
    restEx: circuitConfig.restEx, restRounds: circuitConfig.restRounds,
    exercises: circuitExOut
  } : null;

  const now = new Date();
  const [y, m, d] = sessionDate.split('-').map(Number);
  const entryDate = new Date(y, m - 1, d, now.getHours(), now.getMinutes(), now.getSeconds());

  const entry = { day: activeDay, date: entryDate.toISOString(), principals: principalsOut, circuit: circuitOut };
  const msg = document.getElementById('saveMsg');
  msg.textContent = 'guardando…';

  const snapshotPrincipals = JSON.parse(JSON.stringify(principalState));
  const snapshotCircuitConfig = JSON.parse(JSON.stringify(circuitConfig));
  const snapshotItems = JSON.parse(JSON.stringify(circuitItems));
  const snapshotDate = sessionDate;

  history.push(entry);
  const ok = await saveHistory();
  if(ok){
    msg.textContent = '✓ Guardado permanentemente';
    editingEntry = null;
    resetDayState();
    renderPanel();
    renderHistory();
  } else {
    history.pop();
    principalState = snapshotPrincipals;
    circuitConfig = snapshotCircuitConfig;
    circuitItems = snapshotItems;
    sessionDate = snapshotDate;
    msg.textContent = '✕ Error al guardar';
  }
}

// =====================================================================
//  TEMPORIZADOR DEL CIRCUITO
//  Reps / reps por lado / metros → esperan a tu botón "Hecho"
//  Segundos / seg por lado       → cuenta atrás automática
//  Descansos (entre ejercicios y entre series) → automáticos
// =====================================================================
const timer = { phases:[], idx:0, endAt:0, leftMs:0, running:false, paused:false, handle:null, lastBeepSec:-1, done:false, lastWork:null };
let audioCtx = null;

function getAudio(){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  return audioCtx;
}
// iOS suspende o "interrumpe" el audio al cambiar de app: hay que reactivarlo cada vez
function resumeAudio(){
  try{
    const c = getAudio();
    if(c && c.state !== 'running' && c.resume){ const r = c.resume(); if(r && r.catch) r.catch(() => {}); }
  }catch(e){}
}
function beep(freq, dur){
  try{
    const c = getAudio();
    if(!c) return;
    resumeAudio();
    const o = c.createOscillator();
    const g = c.createGain();
    o.frequency.value = freq;
    g.gain.value = 0.15;
    o.connect(g); g.connect(c.destination);
    o.start();
    o.stop(c.currentTime + (dur || 0.18));
  }catch(e){}
}
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

function numOf(v){ const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }

function buildPhases(){
  const items = circuitItems.filter(i => i && i.name);
  if(!items.length) return [];
  const restEx = parseInt(circuitConfig.restEx) || 15;
  const restR = parseInt(circuitConfig.restRounds) || 60;
  const rounds = parseInt(circuitConfig.rounds) || 3;
  const nextLabel = (it) => `${it.name} · ${doseText(it.unit, it.target)}`;
  const ph = [{ type:'prep', manual:false, dur:5, label:'Prepárate', next: nextLabel(items[0]) }];
  for(let r = 1; r <= rounds; r++){
    items.forEach((it, i) => {
      const val = numOf(it.target);
      const base = {
        type:'work', label: it.name, round:r, rounds, ex:i + 1, exs:items.length,
        exIdx: circuitItems.indexOf(it), unit: it.unit, target: val, weight: it.weight
      };
      if(it.unit === 'reps' || it.unit === 'm'){
        ph.push({ ...base, manual:true });
      } else if(it.unit === 'lado'){
        // un solo "Hecho" cuenta los dos lados
        ph.push({ ...base, manual:true, bothSides:true });
      } else if(it.unit === 'seg'){
        ph.push({ ...base, manual:false, dur: Math.max(1, Math.round(val)) });
      } else if(it.unit === 'segLado'){
        ph.push({ ...base, manual:false, dur: Math.max(1, Math.round(val)), side:1, sides:2 });
        ph.push({ type:'rest', manual:false, dur:5, label:'Cambia de lado', next: `${it.name} · lado 2`, round:r, rounds });
        ph.push({ ...base, manual:false, dur: Math.max(1, Math.round(val)), side:2, sides:2 });
      } else {
        ph.push({ ...base, manual:true });
      }
      const isLast = i === items.length - 1;
      const prev = { exIdx: base.exIdx, round: r };
      if(!isLast) ph.push({ type:'rest', manual:false, dur:restEx, label:'Descanso', next: nextLabel(items[i + 1]), round:r, rounds, prev });
      else if(r < rounds) ph.push({ type:'rest', manual:false, dur:restR, label:'Descanso entre series', next: nextLabel(items[0]), round:r + 1, rounds, prev });
    });
  }
  return ph;
}

function ensureAwakeVideo(){

  const v = document.createElement('video');

  v.src = KEEP_AWAKE_MP4;
  document.body.appendChild(v);
  awake.video = v;
  return v;

async function applyAwake(){
  if(!awake.reasons.size) return;
  if(document.visibilityState && document.visibilityState !== 'visible') return;
  let ok = false;
  if(navigator.wakeLock && navigator.wakeLock.request){
    try{
      if(!awake.lock || awake.lock.released){
        const lock = await navigator.wakeLock.request('screen');
        awake.lock = lock;
        lock.addEventListener('release', () => {
          if(awake.lock === lock) awake.lock = null;
          if(awake.reasons.size && document.visibilityState === 'visible') applyAwake();
          else updateAwakeBadges();
        });
      }
      ok = true;
      awake.mode = 'api';
      try{ if(awake.video && !awake.video.paused) awake.video.pause(); }catch(e){}
    }catch(e){ awake.lock = null; }
  }
  if(!ok){
    try{
      const v = ensureAwakeVideo();
      if(v.paused){ await v.play(); }
      awake.mode = 'video';
      ok = true;
    }catch(e){}
  }
  if(!ok) awake.mode = 'none';
  updateAwakeBadges();
}
function acquireAwake(reason){ awake.reasons.add(reason); return applyAwake(); }
function releaseAwake(reason){
  awake.reasons.delete(reason);
  if(awake.reasons.size) return;
  try{ if(awake.lock){ const l = awake.lock; awake.lock = null; l.release(); } }catch(e){}
  try{ if(awake.video) awake.video.pause(); }catch(e){}
  awake.mode = 'none';
  updateAwakeBadges();
}

}, true);

// Anota lo realizado en una ronda de un ejercicio
function setDone(exIdx, round, value){
  const it = circuitItems[exIdx];
  if(!it) return;
  if(!Array.isArray(it.done)) it.done = [];
  while(it.done.length < round - 1) it.done.push('');
  it.done[round - 1] = String(value);
  refreshDoneInputs();
}

function recordDone(p, skipped, elapsedSec){
  if(p.type !== 'work' || p.exIdx < 0) return;
  const it = circuitItems[p.exIdx];
  if(!it) return;
  let v;
  if(p.manual){
    if(skipped) return;           // saltar un ejercicio por reps: no se anota nada
    v = p.target;
  } else {
    v = skipped ? elapsedSec : p.target;
  }
  if(p.sides === 2 && p.side === 2 && !p.manual){
    const cur = parseFloat(it.done[p.round - 1]);
    if(!isNaN(cur)) v = Math.min(cur, v);
  }
  setDone(p.exIdx, p.round, v);
}

function adjustDone(exIdx, round, delta){
  const it = circuitItems[exIdx];
  if(!it) return;
  const cur = parseFloat(it.done[round - 1]);
  const base = isNaN(cur) ? numOf(it.target) : cur;
  const next = Math.max(0, base + delta);
  setDone(exIdx, round, next);
  const el = document.getElementById('adjVal');
  if(el) el.textContent = String(next);
}

function startPhase(i){
  const p = timer.phases[i];
  if(!p){ finishTimer(); return; }
  timer.idx = i;
  timer.lastBeepSec = -1;
  if(p.manual){
    timer.endAt = 0;
    timer.leftMs = 0;
  } else {
    timer.endAt = Date.now() + p.dur * 1000;
    timer.leftMs = p.dur * 1000;
  }
  if(p.type === 'work'){ beep(880, 0.3); vibrate(200); }
  else if(p.type === 'rest'){ beep(440, 0.25); vibrate(100); }
  renderTimer();
  saveTimerState();
}

function advance(skipped){
  if(!timer.running) return;
  const p = timer.phases[timer.idx];
  let elapsed = 0;
  if(!p.manual && p.dur){
    const msLeft = timer.paused ? timer.leftMs : Math.max(0, timer.endAt - Date.now());
    elapsed = Math.max(0, Math.round(p.dur - msLeft / 1000));
  }
  recordDone(p, skipped, elapsed);
  if(p.type === 'work') timer.lastWork = p;
  startPhase(timer.idx + 1);
}

function timerTick(){
  if(!timer.running || timer.paused) return;
  const p = timer.phases[timer.idx];
  if(!p || p.manual) return;
  const msLeft = timer.endAt - Date.now();
  if(msLeft <= 0){
    let over = -msLeft;
    advance(false);
    // Si estuviste en otra app, el tiempo que pasó cuenta para los descansos siguientes
    while(over > 0 && timer.running){
      const q = timer.phases[timer.idx];
      if(!q || q.manual || q.type === 'work') break;
      if(over >= q.dur * 1000){ over -= q.dur * 1000; advance(false); }
      else { timer.endAt -= over; timer.leftMs = Math.max(0, timer.endAt - Date.now()); updateTimerClock(); break; }
    }
    return;
  }
  timer.leftMs = msLeft;
  const secs = Math.ceil(msLeft / 1000);
  if(secs <= 3 && secs !== timer.lastBeepSec){ timer.lastBeepSec = secs; beep(660, 0.1); }
  updateTimerClock();
}

function fmtClock(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function updateTimerClock(){
  const el = document.getElementById('timerClock');
  if(el) el.textContent = fmtClock(timer.leftMs);
}

function startTimer(){
  const phases = buildPhases();
  if(!phases.length) return;
  timer.phases = phases;
  timer.running = true;
  timer.paused = false;
  timer.done = false;
  timer.lastWork = null;
  acquireAwake('circuit');
  resumeAudio();
  beep(1, 0.01); // desbloquea el audio en el gesto del usuario
  clearInterval(timer.handle);
  timer.handle = setInterval(timerTick, 250);
  startPhase(0);
}
function pauseTimer(){
  if(!timer.running) return;
  const p = timer.phases[timer.idx];
  if(p && p.manual) return;
  if(!timer.paused){ timer.paused = true; timer.leftMs = Math.max(0, timer.endAt - Date.now()); }
  else { timer.paused = false; timer.endAt = Date.now() + timer.leftMs; }
  renderTimer();
  saveTimerState();
}
function skipPhase(){ advance(true); }
function stopTimer(){
  clearInterval(timer.handle);
  timer.running = false; timer.paused = false; timer.done = false;
  releaseAwake('circuit');
  clearTimerState();
  refreshDoneInputs();
  renderTimer();
}
function finishTimer(){
  clearInterval(timer.handle);
  timer.running = false; timer.paused = false; timer.done = true;
  releaseAwake('circuit');
  clearTimerState();
  beep(880, 0.2); setTimeout(() => beep(880, 0.2), 300); setTimeout(() => beep(1175, 0.4), 600);
  vibrate([200, 100, 200, 100, 400]);
  refreshDoneInputs();
  renderTimer();
}

function stepperBlock(exIdx, round){
  const it = circuitItems[exIdx];
  if(!it || !MANUAL_UNITS.includes(it.unit)) return null;
  const step = ADJUST_STEP[it.unit] || 1;
  const cur = parseFloat(it.done[round - 1]);
  const val = isNaN(cur) ? numOf(it.target) : cur;
  const wrap = document.createElement('div');
  wrap.className = 'stepper-wrap';
  const lbl = document.createElement('div');
  lbl.className = 'stepper lbl';
  lbl.style.cssText = 'font-family:IBM Plex Mono,monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;';
  lbl.textContent = `${ADJUST_LABEL[it.unit]} · ${it.name}`;
  const row = document.createElement('div');
  row.className = 'stepper';
  const minus = document.createElement('button');
  minus.textContent = '−';
  minus.onclick = () => adjustDone(exIdx, round, -step);
  const v = document.createElement('div');
  v.className = 'val';
  v.id = 'adjVal';
  v.textContent = String(val);
  const plus = document.createElement('button');
  plus.textContent = '+';
  plus.onclick = () => adjustDone(exIdx, round, step);
  row.appendChild(minus); row.appendChild(v); row.appendChild(plus);
  wrap.appendChild(lbl);
  wrap.appendChild(row);
  return wrap;
}

function renderTimer(){
  const host = document.getElementById('timerHost');
  if(!host) return;
  host.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'panel';

  const h3 = document.createElement('h2');
  h3.textContent = 'Temporizador';
  panel.appendChild(h3);

  if(!timer.running && pendingRestore){
    const rb = document.createElement('div');
    rb.className = 'editing-banner';
    rb.innerHTML = `<span>Tienes un circuito a medias (Día ${pendingRestore.activeDay}).</span>`;
    const bGo = document.createElement('button');
    bGo.textContent = 'Continuar';
    bGo.onclick = restoreTimer;
    const bNo = document.createElement('button');
    bNo.textContent = 'Descartar';
    bNo.onclick = () => { pendingRestore = null; clearTimerState(); renderTimer(); };
    rb.appendChild(bGo); rb.appendChild(bNo);
    panel.appendChild(rb);
  }

  if(!timer.running){
    const restEx = parseInt(circuitConfig.restEx) || 15;
    const restR = parseInt(circuitConfig.restRounds) || 60;
    const rounds = parseInt(circuitConfig.rounds) || 3;
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = timer.done
      ? '✓ Circuito terminado'
      : `${circuitItems.length} ejercicios · ${rounds} series · ${restEx}s entre ejercicios · ${restR}s entre series`;
    panel.appendChild(sub);

    if(timer.done && timer.lastWork){
      const adj = stepperBlock(timer.lastWork.exIdx, timer.lastWork.round);
      if(adj){ adj.style.marginBottom = '12px'; panel.appendChild(adj); }
    }

    const start = document.createElement('button');
    start.className = 'save-btn';
    start.textContent = timer.done ? '▶ Repetir circuito' : '▶ Iniciar circuito';
    start.disabled = !circuitItems.length;
    start.onclick = startTimer;
    panel.appendChild(start);
  } else {
    const p = timer.phases[timer.idx];
    const box = document.createElement('div');
    box.className = 'timer-box timer-' + p.type + (timer.paused ? ' timer-paused' : '');
    let title = '';
    let detail = '';
    let bodyHtml = '';
    if(p.type === 'work'){
      title = p.label;
      const sideTxt = p.sides ? ` · lado ${p.side}/${p.sides}` : '';
      const wTxt = p.weight ? ` · ${p.weight} kg` : '';
      detail = `Ejercicio ${p.ex}/${p.exs} · Serie ${p.round}/${p.rounds}${wTxt}`;
      if(p.manual){
        const unitTxt = p.unit === 'm' ? 'metros' : (p.unit === 'lado' ? 'reps por lado · ambos lados' : 'reps');
        bodyHtml = `<div class="timer-target">${p.target}</div><div class="timer-target-unit">${unitTxt}</div>`;
      } else {
        bodyHtml = `<div class="timer-clock" id="timerClock">${fmtClock(timer.leftMs)}</div>` +
          (p.sides ? `<div class="timer-target-unit">lado ${p.side}/${p.sides}</div>` : '');
      }
    } else if(p.type === 'rest'){
      title = p.label;
      detail = `Siguiente: ${p.next}` + (p.round ? ` · Serie ${p.round}/${p.rounds}` : '');
      bodyHtml = `<div class="timer-clock" id="timerClock">${fmtClock(timer.leftMs)}</div>`;
    } else {
      title = p.label;
      detail = `Primero: ${p.next}`;
      bodyHtml = `<div class="timer-clock" id="timerClock">${fmtClock(timer.leftMs)}</div>`;
    }
    box.innerHTML = `
      <div class="timer-phase">${p.type === 'work' ? 'TRABAJO' : p.type === 'rest' ? 'DESCANSO' : 'PREPARACIÓN'}${timer.paused ? ' · PAUSA' : ''}</div>
      <div class="timer-title">${title}</div>
      ${bodyHtml}
      <div class="timer-detail">${detail}</div>
    `;
    // En descansos se puede corregir las reps del ejercicio recién hecho
    if(p.type === 'rest' && p.prev){
      const adj = stepperBlock(p.prev.exIdx, p.prev.round);
      if(adj) box.appendChild(adj);
    }
    panel.appendChild(box);

    const badge = document.createElement('div');
    badge.className = 'awake-badge';
    badge.onclick = () => applyAwake();
    panel.appendChild(badge);
    updateAwakeBadges();

    if(p.type === 'work' && p.manual){
      const doneBtn = document.createElement('button');
      doneBtn.className = 'save-btn timer-done-btn';
      doneBtn.textContent = '✓ Hecho';
      doneBtn.onclick = () => advance(false);
      panel.appendChild(doneBtn);
    }

    const row = document.createElement('div');
    row.className = 'timer-controls';
    if(!p.manual){
      const bPause = document.createElement('button');
      bPause.className = 'reset';
      bPause.textContent = timer.paused ? '▶ Reanudar' : '⏸ Pausa';
      bPause.onclick = pauseTimer;
      row.appendChild(bPause);
    }
    const bSkip = document.createElement('button');
    bSkip.className = 'reset';
    bSkip.textContent = '⏭ Saltar';
    bSkip.onclick = skipPhase;
    const bStop = document.createElement('button');
    bStop.className = 'reset';
    bStop.textContent = '⏹ Parar';
    bStop.onclick = stopTimer;
    row.appendChild(bSkip); row.appendChild(bStop);
    panel.appendChild(row);
  }
  host.appendChild(panel);
}

// =====================================================================
//  CIRCUITO A MEDIAS: se guarda para poder continuar si Chrome recarga la página
// =====================================================================
const TIMER_STATE_KEY = 'javier-rutina-timer-v1';
let pendingRestore = null;

function saveTimerState(){
  if(!timer.running) return;
  try{
    localStorage.setItem(TIMER_STATE_KEY, JSON.stringify({
      savedAt: Date.now(), activeDay, sessionDate, circuitConfig, circuitItems, principalState,
      phases: timer.phases, idx: timer.idx, paused: timer.paused, endAt: timer.endAt, leftMs: timer.leftMs
    }));
  }catch(e){}
}
function clearTimerState(){ try{ localStorage.removeItem(TIMER_STATE_KEY); }catch(e){} }
function loadPendingTimer(){
  try{
    const raw = localStorage.getItem(TIMER_STATE_KEY);
    if(!raw) return;
    const st = JSON.parse(raw);
    if(!st || !Array.isArray(st.phases) || !st.phases.length || !DAYS[st.activeDay] || Date.now() - st.savedAt > 4 * 3600 * 1000){
      clearTimerState();
      return;
    }
    pendingRestore = st;
  }catch(e){}
}
function restoreTimer(){
  const st = pendingRestore;
  if(!st) return;
  pendingRestore = null;
  editingEntry = null;
  activeDay = st.activeDay; sessionDate = st.sessionDate;
  circuitConfig = st.circuitConfig; circuitItems = st.circuitItems; principalState = st.principalState;
  timer.phases = st.phases;
  timer.idx = Math.min(st.idx, st.phases.length - 1);
  timer.running = true; timer.done = false; timer.lastWork = null; timer.lastBeepSec = -1;
  const p = timer.phases[timer.idx];
  if(p.manual){
    timer.paused = false; timer.endAt = 0; timer.leftMs = 0;
  } else {
    const left = st.paused ? st.leftMs : (st.endAt - Date.now());
    timer.leftMs = Math.max(1000, left);
    timer.paused = true;                  // se retoma con "Reanudar"
    timer.endAt = Date.now() + timer.leftMs;
  }
  acquireAwake('circuit');
  resumeAudio();
  clearInterval(timer.handle);
  timer.handle = setInterval(timerTick, 250);
  renderTabs();
  renderPanel();
  saveTimerState();
}

// =====================================================================
//  DESCANSO DE LOS FIJOS (barra fija abajo)
//  Eliges 1:00 / 1:30 / 2:00, pulsas "Descanso" al acabar cada serie y cuenta las series
// =====================================================================
const REST_KEY = 'javier-rutina-rest-v1';
const REST_OPTIONS = [60, 90, 120];
const rest = { sec:90, count:0, endAt:0, running:false, finished:false, handle:null, lastBeep:-1 };

function fmtRestOpt(sec){ return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function saveRest(){
  try{ localStorage.setItem(REST_KEY, JSON.stringify({ sec:rest.sec, count:rest.count, endAt:rest.endAt, running:rest.running })); }catch(e){}
}
function loadRest(){
  try{
    const raw = localStorage.getItem(REST_KEY);
    if(!raw) return;
    const st = JSON.parse(raw);
    if(REST_OPTIONS.includes(st.sec)) rest.sec = st.sec;
    if(Number.isInteger(st.count) && st.count >= 0) rest.count = st.count;
    if(st.running && st.endAt){
      rest.endAt = st.endAt;
      if(st.endAt > Date.now()){
        rest.running = true;
        rest.handle = setInterval(restTick, 250);
        acquireAwake('rest');
      } else {
        rest.finished = true;
      }
    }
  }catch(e){}
}
function startRest(){
  resumeAudio();
  beep(1, 0.01);                          // desbloquea el audio con el toque
  rest.count += 1;
  rest.endAt = Date.now() + rest.sec * 1000;
  rest.running = true; rest.finished = false; rest.lastBeep = -1;
  clearInterval(rest.handle);
  rest.handle = setInterval(restTick, 250);
  acquireAwake('rest');
  saveRest();
  renderRestBar();
}
function stopRest(){
  clearInterval(rest.handle);
  rest.running = false; rest.finished = false;
  releaseAwake('rest');
  saveRest();
  renderRestBar();
}
function finishRest(){
  clearInterval(rest.handle);
  rest.running = false; rest.finished = true;
  releaseAwake('rest');
  beep(880, 0.2); setTimeout(() => beep(880, 0.2), 300); setTimeout(() => beep(1175, 0.4), 600);
  vibrate([200, 100, 200, 100, 400]);
  saveRest();
  renderRestBar();
}
function resetRest(){
  clearInterval(rest.handle);
  rest.running = false; rest.finished = false; rest.count = 0;
  releaseAwake('rest');
  saveRest();
  renderRestBar();
}
function adjustRestCount(d){
  rest.count = Math.max(0, rest.count + d);
  saveRest();
  renderRestBar();
}
function setRestSec(sec){
  if(rest.running) return;
  rest.sec = sec;
  saveRest();
  renderRestBar();
}
function restTick(){
  if(!rest.running) return;
  const left = rest.endAt - Date.now();
  if(left <= 0){ finishRest(); return; }
  const secs = Math.ceil(left / 1000);
  if(secs <= 3 && secs !== rest.lastBeep){ rest.lastBeep = secs; beep(660, 0.1); }
  const el = document.getElementById('restClock');
  if(el) el.textContent = fmtClock(left);
}

function renderRestBar(){
  const host = document.getElementById('restBar');
  if(!host) return;
  host.className = 'restbar' + (rest.running ? ' running' : (rest.finished ? ' finished' : ''));
  host.innerHTML = '';
  const inner = document.createElement('div');
  inner.className = 'rest-inner';

  // Fila 1: título, contador de series, reset
  const r1 = document.createElement('div');
  r1.className = 'rest-row';
  const title = document.createElement('div');
  title.className = 'rest-title grow';
  title.textContent = 'Descanso fijos';
  const minus = document.createElement('button');
  minus.className = 'rest-mini'; minus.textContent = '−';
  minus.onclick = () => adjustRestCount(-1);
  const cnt = document.createElement('div');
  cnt.className = 'rest-count';
  cnt.textContent = `Series: ${rest.count}`;
  const plus = document.createElement('button');
  plus.className = 'rest-mini'; plus.textContent = '+';
  plus.onclick = () => adjustRestCount(1);
  const rs = document.createElement('button');
  rs.className = 'reset'; rs.textContent = '↺ Reset';
  rs.onclick = resetRest;
  [title, minus, cnt, plus, rs].forEach(n => r1.appendChild(n));
  inner.appendChild(r1);

  // Fila 2: tiempos y botón
  const r2 = document.createElement('div');
  r2.className = 'rest-row';
  REST_OPTIONS.forEach(sec => {
    const chip = document.createElement('button');
    chip.className = 'rest-chip' + (rest.sec === sec ? ' on' : '');
    chip.textContent = fmtRestOpt(sec);
    chip.disabled = rest.running;
    chip.onclick = () => setRestSec(sec);
    r2.appendChild(chip);
  });
  const go = document.createElement('button');
  go.className = 'rest-go' + (rest.running ? ' stop' : '');
  go.textContent = rest.running ? '⏹ Parar' : '▶ Descanso';
  go.onclick = rest.running ? stopRest : startRest;
  r2.appendChild(go);
  inner.appendChild(r2);

  // Fila 3: estado
  const r3 = document.createElement('div');
  r3.className = 'rest-row';
  if(rest.running){
    const clk = document.createElement('div');
    clk.className = 'rest-clock grow';
    clk.id = 'restClock';
    clk.textContent = fmtClock(Math.max(0, rest.endAt - Date.now()));
    const badge = document.createElement('div');
    badge.className = 'awake-badge';
    badge.onclick = () => applyAwake();
    r3.appendChild(clk); r3.appendChild(badge);
    inner.appendChild(r3);
  } else if(rest.finished){
    const msg = document.createElement('div');
    msg.className = 'rest-msg';
    msg.textContent = `✓ Descanso listo · empieza la serie ${rest.count + 1}`;
    r3.appendChild(msg);
    inner.appendChild(r3);
  } else if(rest.count === 0){
    const msg = document.createElement('div');
    msg.className = 'rest-msg';
    msg.textContent = 'Termina tu serie y pulsa Descanso.';
    r3.appendChild(msg);
    inner.appendChild(r3);
  }
  host.appendChild(inner);
  updateAwakeBadges();
}

// Al volver a la página (otra pestaña, otra app, pantalla apagada): reactiva todo y resincroniza relojes
function onReturn(){
  if(document.visibilityState && document.visibilityState !== 'visible') return;
  resumeAudio();
  applyAwake();
  if(timer.running && !timer.paused) timerTick();
  restTick();
  if(timer.running) renderTimer();
}
document.addEventListener('visibilitychange', onReturn);
window.addEventListener('pageshow', onReturn);
window.addEventListener('focus', onReturn);

// =====================================================================
//  HISTORIAL (vista)
// =====================================================================
function weekKey(dateStr){
  const d = new Date(dateStr);
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  monday.setHours(0,0,0,0);
  return monday.toISOString().slice(0,10);
}

function weekLabel(mondayStr){
  const monday = new Date(mondayStr);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
  return `Semana ${fmt(monday)} – ${fmt(sunday)}`;
}

function renderHistory(){
  const host = document.getElementById('histList');
  host.innerHTML = '';
  if(!history.length){
    host.innerHTML = '<div class="empty">Aún no hay sesiones guardadas.</div>';
    return;
  }

  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  let currentWeek = null;
  sorted.forEach(h => {
    const wk = weekKey(h.date);
    if(wk !== currentWeek){
      currentWeek = wk;
      const divider = document.createElement('div');
      divider.className = 'week-divider';
      divider.innerHTML = `<div class="label">${weekLabel(wk)}</div><div class="line"></div>`;
      host.appendChild(divider);
    }
    const row = document.createElement('div');
    row.className = 'hist-entry';
    const date = new Date(h.date);
    const dateStr = date.toLocaleDateString('es-ES', {weekday:'short', day:'2-digit', month:'short'});

    let html = `<div class="hist-head"><span class="hist-day">${h.day}</span><span class="hist-date">${dateStr}</span>
      <span class="hist-actions"><span class="hist-action edit" data-action="edit">editar</span><span class="hist-action del" data-action="del">eliminar</span></span></div>`;

    if(h.principals && h.principals.length){
      html += `<div class="hist-sub">Fijos</div>`;
      h.principals.forEach(p => {
        const repsTxt = (p.reps || []).filter(r => r !== '').join(', ') || '–';
        html += `<div class="hist-ex"><span class="n">${p.name}</span>
          <span class="v">${repsTxt} reps @ ${p.weight || '–'}kg</span>
          ${p.comment ? `<span class="c">"${p.comment}"</span>` : ''}</div>`;
      });
    }

    if(h.circuit){
      const c = h.circuit;
      const cfgParts = [];
      if(c.rounds) cfgParts.push(`${c.rounds} series`);
      if(c.workSec) cfgParts.push(`${c.workSec}s trabajo`);
      if(c.restEx) cfgParts.push(`${c.restEx}s desc. ejerc.`);
      if(c.restRounds) cfgParts.push(`${c.restRounds}s desc. series`);
      html += `<div class="hist-sub">Circuito</div>`;
      if(cfgParts.length) html += `<div class="hist-circuit-cfg">${cfgParts.join(' · ')}</div>`;
      (c.exercises || []).forEach(e => {
        const parts = [];
        if(e.unit) parts.push(doseText(e.unit, e.target));
        parts.push(e.weight ? e.weight + 'kg' : 'sin peso');
        if(Array.isArray(e.done) && e.done.length) parts.push('hecho ' + e.done.join(','));
        html += `<div class="hist-ex"><span class="n">${e.name}</span>
          <span class="v">${parts.join(' · ')}</span>
          ${e.comment ? `<span class="c">"${e.comment}"</span>` : ''}</div>`;
      });
    }

    row.innerHTML = html;
    row.querySelector('[data-action="edit"]').onclick = () => loadEntryForEditing(h);
    row.querySelector('[data-action="del"]').onclick = () => {
      if(confirmingDelete === h){
        deleteEntry(h);
        confirmingDelete = null;
      } else {
        confirmingDelete = h;
        renderHistory();
      }
    };
    if(confirmingDelete === h){
      const confirmDiv = document.createElement('div');
      confirmDiv.style.cssText = 'margin-top:4px;font-size:10px;color:var(--rust);font-family:IBM Plex Mono,monospace;';
      confirmDiv.textContent = '⚠ Pulsa "eliminar" para confirmar';
      row.appendChild(confirmDiv);
    }
    host.appendChild(row);
  });
}

document.getElementById('resetBtn').onclick = () => {
  const host = document.getElementById('resetConfirm');
  host.innerHTML = `
    <div class="reset-confirm-box">
      <p>¿Borrar todo el historial?</p>
      <div class="btns">
        <button class="btn-confirm-yes" id="confirmYes">Sí, borrar</button>
        <button class="btn-confirm-no" id="confirmNo">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('confirmYes').onclick = async () => {
    history = [];
    await saveHistory();
    host.innerHTML = '';
    renderHistory();
    resetDayState();
    renderPanel();
  };
  document.getElementById('confirmNo').onclick = () => { host.innerHTML = ''; };
};

document.getElementById('exportBtn').onclick = exportBackup;
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
};
document.getElementById('settingsToggle').onclick = () => {
  settingsOpen = !settingsOpen;
  document.getElementById('settingsToggle').textContent = settingsOpen ? '⚙ Cerrar edición' : '⚙ Editar ejercicios';
  renderSettingsPanel();
};

async function initApp(){
  loadConfig();
  await loadHistory();
  resetDayState();
  loadPendingTimer();
  renderTabs();
  renderPanel();
  loadRest();
  renderRestBar();
}

initApp();
